<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cubing Timer</title>
<meta name="description" content="Free online cubing timer with CFOP, Roux, ZZ, Petrus trainers. Offline-capable PWA.">
<meta name="theme-color" content="#2f6fe4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cubing Timer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg%3E%3Crect x='0' y='0' width='10' height='10' rx='2' fill='%23f0565b'/%3E%3Crect x='11' y='0' width='10' height='10' rx='2' fill='%235b93ff'/%3E%3Crect x='22' y='0' width='10' height='10' rx='2' fill='%23f5c518'/%3E%3Crect x='0' y='11' width='10' height='10' rx='2' fill='%232fd382'/%3E%3Crect x='11' y='11' width='10' height='10' rx='2' fill='%23ff9a4d'/%3E%3Crect x='22' y='11' width='10' height='10' rx='2' fill='%238a92b8'/%3E%3Crect x='0' y='22' width='10' height='10' rx='2' fill='%235b93ff'/%3E%3Crect x='11' y='22' width='10' height='10' rx='2' fill='%23f0565b'/%3E%3Crect x='22' y='22' width='10' height='10' rx='2' fill='%232fd382'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Chivo+Mono:wght@500;800&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;800&family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&family=Outfit:wght@400;600;800&family=Roboto+Mono:wght@500;700&display=swap">
<!-- scramble images drawn offline via canvas; CDN optional -->
<style>
:root{
--bg:#eef0f6;--pan:#fff;--ink:#161a2e;--mute:#6b7396;--line:#dde1ee;--red:#d93a3f;--grn:#13a35f;--blu:#2f6fe4;--org:#f07a1f;--yel:#d9a400;
--font-ui:'Bricolage Grotesque',system-ui,sans-serif;--font-mono:'Chivo Mono',ui-monospace,monospace;
--time-min:64px;--time-vw:15vw;--time-max:168px;--scr-size:clamp(16px,2.6vw,24px);--scr-long:clamp(13px,1.8vw,17px);--base:15px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#12162a;--pan:#1b2140;--ink:#eceffc;--mute:#8a92b8;--line:#2a3158;--red:#f0565b;--grn:#2fd382;--blu:#5b93ff;--org:#ff9a4d;--yel:#f5c518;color-scheme:dark}}
:root[data-theme="light"]{--bg:#eef0f6;--pan:#fff;--ink:#161a2e;--mute:#6b7396;--line:#dde1ee;--red:#d93a3f;--grn:#13a35f;--blu:#2f6fe4;--org:#f07a1f;--yel:#d9a400;color-scheme:light}
:root[data-theme="dark"]{--bg:#12162a;--pan:#1b2140;--ink:#eceffc;--mute:#8a92b8;--line:#2a3158;--red:#f0565b;--grn:#2fd382;--blu:#5b93ff;--org:#ff9a4d;--yel:#f5c518;color-scheme:dark}
:root[data-theme="midnight"]{--bg:#0b0d14;--pan:#141824;--ink:#e8ecf8;--mute:#7b849e;--line:#222838;--red:#ff5c6c;--grn:#3dd68c;--blu:#6ea8ff;--org:#ff9b4a;--yel:#ffd166;color-scheme:dark}
:root[data-theme="forest"]{--bg:#eef6ef;--pan:#f7fbf7;--ink:#14301c;--mute:#5f7a66;--line:#cfe0d2;--red:#c23b3b;--grn:#1f8f4e;--blu:#2d6a8f;--org:#c56a1a;--yel:#b8940f;color-scheme:light}
:root[data-theme="sunset"]{--bg:#1a1210;--pan:#261a16;--ink:#ffefe6;--mute:#c39b8a;--line:#3d2a24;--red:#ff6b5a;--grn:#7dcc6a;--blu:#6aa8ff;--org:#ff9a3c;--yel:#ffc857;color-scheme:dark}
:root[data-theme="ocean"]{--bg:#e8f3f8;--pan:#f5fbfd;--ink:#0f2a38;--mute:#5a7888;--line:#c5dce6;--red:#d64545;--grn:#1f9d6a;--blu:#1f7ab8;--org:#d97b2d;--yel:#c9a20a;color-scheme:light}
:root[data-theme="mono"]{--bg:#f2f2f2;--pan:#fafafa;--ink:#111;--mute:#666;--line:#ddd;--red:#b00020;--grn:#0a7a3e;--blu:#1a5cff;--org:#b85c00;--yel:#9a7b00;color-scheme:light}
:root[data-theme="terminal"]{--bg:#0c0f0c;--pan:#121812;--ink:#c8f0c8;--mute:#6a9a6a;--line:#1e2a1e;--red:#ff6b6b;--grn:#39ff14;--blu:#66d9ef;--org:#fd971f;--yel:#e6db74;color-scheme:dark}
:root[data-theme="rose"]{--bg:#fbf0f3;--pan:#fff7f9;--ink:#3a1524;--mute:#9a6b7c;--line:#efd3dc;--red:#d6285a;--grn:#2a9d6e;--blu:#5b6cff;--org:#e07a2f;--yel:#c9a227;color-scheme:light}
:root[data-theme="slate"]{--bg:#e9edf3;--pan:#f6f8fb;--ink:#1a2332;--mute:#6b778c;--line:#d0d7e3;--red:#c73e4a;--grn:#1f9a64;--blu:#3b6fd8;--org:#d27a2c;--yel:#b89612;color-scheme:light}
:root[data-size="compact"]{--base:13px;--time-min:48px;--time-vw:12vw;--time-max:120px;--scr-size:clamp(13px,2vw,18px);--scr-long:clamp(11px,1.5vw,14px)}
:root[data-size="normal"]{--base:15px;--time-min:64px;--time-vw:15vw;--time-max:168px;--scr-size:clamp(16px,2.6vw,24px);--scr-long:clamp(13px,1.8vw,17px)}
:root[data-size="large"]{--base:17px;--time-min:80px;--time-vw:18vw;--time-max:200px;--scr-size:clamp(18px,3vw,28px);--scr-long:clamp(14px,2vw,20px)}
:root[data-size="huge"]{--base:19px;--time-min:96px;--time-vw:20vw;--time-max:240px;--scr-size:clamp(20px,3.4vw,32px);--scr-long:clamp(15px,2.2vw,22px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 var(--base)/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;background-size:cover;background-position:center;background-attachment:fixed}
body.has-bg{background-color:var(--bg)}
body.has-bg::before{content:'';position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 72%,transparent);pointer-events:none;z-index:-1}
header,.chips,aside,#stage>.top,#quick,#simg,#scramHelper,#trainerBar,#opts,#anim3d{transition:opacity .22s ease}
body.running header,body.running .chips,body.running aside,body.running #stage>.top,body.running #quick,body.running #simg,body.running #scramHelper,body.running #trainerBar,body.running #opts,body.running #anim3d{opacity:0;pointer-events:none}
/* Theater: hide chrome cleanly (display none avoids leftover gaps) */
body.theater header .bar,
body.theater aside,
body.theater #stage>.top,
body.theater #quick,
body.theater #simg,
body.theater #scramHelper,
body.theater #anim3d,
body.theater #trainerBar,
body.theater #opts{display:none!important}
body.theater header{justify-content:center;padding:10px 18px 4px}
body.theater header .brand .ver{display:none}
body.theater main{grid-template-columns:1fr;max-width:920px;padding-top:0}
body.theater #pad{min-height:72vh}
body.theater #theaterExit{display:inline-flex!important}
#theaterExit{display:none;position:fixed;top:10px;right:12px;z-index:40;font-size:12px;font-weight:700;opacity:.75;padding:6px 10px}
#theaterExit:hover{opacity:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 10px;max-width:1280px;margin:auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.logo{display:grid;grid-template:repeat(3,7px)/repeat(3,7px);gap:2px}.logo i{border-radius:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,button,input{font:inherit;color:inherit}
select,button{background:var(--pan);border:1.5px solid var(--line);border-radius:11px;padding:7px 12px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
button:hover,select:hover{border-color:var(--mute)}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:4px 18px 28px;max-width:1280px;margin:auto}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr);gap:14px}}
#stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;gap:8px;align-items:center;background:var(--pan);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
#scr{flex:1;text-align:center;font:500 var(--scr-size)/1.55 var(--font-mono);padding:4px 6px;word-spacing:.18em}
#scr.long{font-size:var(--scr-long)}
.cfop-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;padding:4px;background:var(--pan);border:1.5px solid var(--line);border-radius:999px;width:fit-content;max-width:100%;margin:0 auto}
#methodRow{margin-bottom:0}
#stageRow{padding:3px;margin-top:6px}
#stageRow:empty{display:none}
#stageRow .cfop-btn{padding:5px 12px;font-size:12px}
.cfop-label{font-weight:800;font-size:10px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin:0 4px 0 8px}
.cfop-btn{background:transparent;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;font:600 13px var(--font-ui);color:var(--mute);transition:background .15s,color .15s,box-shadow .15s}
.cfop-btn:hover{color:var(--ink);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.cfop-btn.active{background:var(--blu);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--blu) 35%,transparent)}
#trainerBar{display:flex;flex-direction:column;align-items:center;gap:0;padding:2px 0 4px}
#casebar{display:none;text-align:center;color:var(--mute);font-size:14px;padding:10px 14px;background:var(--pan);border:1.5px solid var(--line);border-radius:14px}
#casebar.on{display:block}
#casebar b{color:var(--ink);font-weight:800;font-size:15px}
#casebar .alg{font-family:var(--font-mono);color:var(--blu);font-size:13px;margin-top:6px;word-break:break-word}
body.cfop #ev{display:none}
#simg{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0;transition:opacity .22s;margin:0;gap:8px}
#simg:empty,#simg[hidden]{display:none;min-height:0}
#simg canvas.scrnet{width:min(240px,80vw);height:auto;display:block;margin:0 auto;border-radius:12px;background:color-mix(in srgb,var(--pan) 80%,var(--bg))}
#scramHelper{display:none;width:100%;max-width:480px;margin:0 auto;text-align:center;background:var(--pan);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
#scramHelper.on{display:block}
#scramHelper .big-move{font:800 clamp(32px,7vw,52px)/1.05 var(--font-mono);color:var(--blu);min-height:1.15em;letter-spacing:.03em}
#scramHelper .step-meta{color:var(--mute);font-size:13px;margin:6px 0 10px}
#scramHelper .step-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#scramHelper .step-btns button{min-width:48px;border-radius:12px;font-weight:700}
#scr .scr-tok{padding:2px 3px;border-radius:5px;transition:background .12s,opacity .12s}
#scr .scr-tok.done{opacity:.4}
#scr .scr-tok.cur{background:var(--blu);color:#fff;font-weight:800;box-shadow:0 1px 6px color-mix(in srgb,var(--blu) 40%,transparent)}
#pad{background:var(--pan);border:2px solid var(--line);border-radius:24px;min-height:46vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer;padding:24px 20px;transition:border-color .14s,box-shadow .18s,background .14s;box-shadow:0 8px 32px color-mix(in srgb,var(--ink) 6%,transparent)}
#pad:hover{border-color:color-mix(in srgb,var(--mute) 55%,var(--line))}
#time{font:800 clamp(var(--time-min),var(--time-vw),var(--time-max))/1 var(--font-mono);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
#sub{color:var(--mute);text-align:center;min-height:1.4em;font-size:.95em}
#pad[data-s=hold]{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent)}#pad[data-s=hold] #time{color:var(--red)}
#pad[data-s=ready]{border-color:var(--grn);box-shadow:0 0 0 3px color-mix(in srgb,var(--grn) 25%,transparent)}#pad[data-s=ready] #time{color:var(--grn)}
#pad[data-s=insp] #time{color:var(--org)}#pad[data-s=insp]{border-color:var(--org);box-shadow:0 0 0 3px color-mix(in srgb,var(--org) 22%,transparent)}
#pad[data-s=run]{border-color:color-mix(in srgb,var(--blu) 50%,var(--line))}
#man{display:none;font:600 28px var(--font-mono);text-align:center;width:min(320px,80%);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px}
body.manual #man{display:block}
#quick{display:flex;gap:8px;align-items:center;justify-content:center;min-height:36px;color:var(--mute);flex-wrap:wrap;font-size:.95em}
#quick button{padding:5px 10px;font-size:13px;border-radius:9px}
#opts{background:var(--pan);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
#opts summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);list-style:none;user-select:none}
#opts summary::-webkit-details-marker{display:none}
#opts summary::after{content:'▸';float:right;transition:transform .15s}
#opts[open] summary::after{transform:rotate(90deg)}
#opts[open] summary{border-bottom:1px solid var(--line);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-start;padding:12px 14px 14px}
.chips label{display:flex;gap:6px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .12s}
.chips label:hover{border-color:var(--mute)}
.chips input{accent-color:var(--blu);margin:0}
.chips select,.chips input[type=number]{font-size:13px}
aside{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:12px;align-self:start}
.card{background:var(--pan);border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:0 2px 12px color-mix(in srgb,var(--ink) 4%,transparent)}
.st{display:grid;grid-template-columns:1fr auto auto;gap:5px 16px;font-variant-numeric:tabular-nums;font-size:.95em}
.st b{text-align:right;font-weight:700}.st .h{color:var(--mute);text-align:right;font-size:.85em;text-transform:uppercase;letter-spacing:.04em}.st span:nth-child(3n+1){color:var(--mute)}
#sparkCard{padding:10px 12px}
#sparkCv{width:100%;height:72px;display:block;border-radius:8px}
#anim3d{width:120px;height:120px;margin:0 auto;perspective:500px}
#anim3d .acube{width:70px;height:70px;margin:25px auto;position:relative;transform-style:preserve-3d;transform:rotateX(-28deg) rotateY(-38deg)}
#anim3d .af{position:absolute;width:70px;height:70px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:2px;padding:2px;background:#111;border-radius:4px}
#anim3d .af i{border-radius:3px}
#anim3d .af.U{transform:rotateX(90deg) translateZ(35px)}
#anim3d .af.D{transform:rotateX(-90deg) translateZ(35px)}
#anim3d .af.F{transform:translateZ(35px)}
#anim3d .af.B{transform:rotateY(180deg) translateZ(35px)}
#anim3d .af.R{transform:rotateY(90deg) translateZ(35px)}
#anim3d .af.L{transform:rotateY(-90deg) translateZ(35px)}
/* Times sheet: fixed max height, whole card scrolls; header sticks at top */
#list{padding:0;max-height:min(420px,55vh);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mute) 60%,var(--blu)) color-mix(in srgb,var(--bg) 75%,var(--pan));-webkit-overflow-scrolling:touch}
#list::-webkit-scrollbar{width:10px}
#list::-webkit-scrollbar-track{background:color-mix(in srgb,var(--bg) 65%,var(--pan));border-radius:999px;margin:6px 2px;border:1px solid var(--line)}
#list::-webkit-scrollbar-thumb{background:linear-gradient(180deg,color-mix(in srgb,var(--mute) 50%,var(--line)),color-mix(in srgb,var(--mute) 55%,var(--blu)));border:2px solid color-mix(in srgb,var(--bg) 65%,var(--pan));border-radius:999px;min-height:36px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent)}
#list::-webkit-scrollbar-thumb:hover{background:var(--blu);border-color:color-mix(in srgb,var(--blu) 25%,var(--pan))}
#list::-webkit-scrollbar-thumb:active{background:color-mix(in srgb,var(--blu) 75%,var(--ink))}
#list::-webkit-scrollbar-corner{background:transparent}
#list .list-head{display:grid;grid-template-columns:36px 1fr 1fr 1fr;width:100%;text-align:right;padding:12px 14px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);background:var(--pan);position:sticky;top:0;z-index:2}
#list .list-head span:first-child{text-align:left}
#list .list-body{padding:4px 8px 10px}
.row{display:grid;grid-template-columns:36px 1fr 1fr 1fr;width:100%;text-align:right;border:0;border-radius:9px;padding:7px 8px;background:none;font-variant-numeric:tabular-nums;font-size:.95em}
.row:hover{background:var(--bg)}.row span:first-child{text-align:left;color:var(--mute)}.row span{color:var(--mute)}.row b{font-weight:700;color:var(--ink)}
.row.pb b{color:var(--grn)}
.empty{color:var(--mute);padding:24px 14px;text-align:center;line-height:1.5}
dialog{background:var(--pan);color:var(--ink);border:1.5px solid var(--line);border-radius:20px;padding:22px;max-width:min(460px,92vw);width:100%;box-shadow:0 20px 60px color-mix(in srgb,var(--ink) 25%,transparent)}
dialog::backdrop{background:rgba(10,12,28,.55);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 4px;font:800 36px var(--font-mono);letter-spacing:-.03em}
dialog p{color:var(--mute);margin:4px 0 12px}
dialog .s{color:var(--ink);font:500 14px/1.6 var(--font-mono);word-break:break-word}
dialog textarea{width:100%;height:150px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px;font:13px/1.4 var(--font-mono)}
dialog input[type=text]{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns button{font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;font-weight:650;z-index:50;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 30%,transparent)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.help-list{margin:0;padding-left:18px;color:var(--mute);line-height:1.75}
.help-list b{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo" id="logo"></span>Cubing timer</div>
  <div class="bar">
    <select id="sess" aria-label="Session"></select>
    <button id="newS">New session</button>
    <button id="renS" title="Rename current session">Rename</button>
    <button id="data">Import / export</button>
    <button id="bt" title="Connect smart cube (Chrome/Edge, HTTPS required)">BT</button>
    <button id="backup" title="Download backup JSON">Backup</button>
    <button id="help">Help</button>
    <button id="theme" title="Cycle theme: Auto → Light → Dark (more themes in Options)">◐ Auto</button>
  </div>
</header>
<button type="button" id="theaterExit" title="Exit theater mode (T)">Exit theater (T)</button>
<main>
  <section id="stage">
    <div id="trainerBar">
      <div class="cfop-row" id="methodRow">
        <button type="button" class="cfop-btn" data-method="timer">Timer</button>
        <button type="button" class="cfop-btn" data-method="cfop">CFOP</button>
        <button type="button" class="cfop-btn" data-method="begcfop">Beg CFOP</button>
        <button type="button" class="cfop-btn" data-method="roux">Roux</button>

const $=q=>document.querySelector(q),KEY='cubetimer.v1';
function sc(groups,mods,len){
  const o=[];let la=-1;
  while(o.length<len){
    let a;do a=Math.random()*groups.length|0;while(a===la);
    la=a;const g=groups[a];
    o.push(g[Math.random()*g.length|0]+mods[Math.random()*mods.length|0]);
  }
  return o.join(' ');
}
const M3=['','\'','2'],M2=['','\''];
function scSq1(){
  const moves=[];
  for(let i=0;i<16;i++){
    const u=Math.floor(Math.random()*12)-5,d=Math.floor(Math.random()*12)-5;
    moves.push(`(${u},${d})`);
    if(i<15)moves.push('/');
  }
  return moves.join(' ');
}
function scClock(){
  const pins=['UR','DR','DL','UL'],face=['U','R','D','L','ALL'];
  let s='';
  face.forEach(f=>{const n=Math.floor(Math.random()*12)-5;if(n)s+=`${f}${n>0?'+'+n:n} `});
  pins.forEach(p=>{if(Math.random()<.5)s+=p+' '});
  s+='y2 ';
  face.forEach(f=>{const n=Math.floor(Math.random()*12)-5;if(n)s+=`${f}${n>0?'+'+n:n} `});
  pins.forEach(p=>{if(Math.random()<.5)s+=p+' '});
  return s.trim();
}
function scMinx(){
  const faces=['U','R','F','L','BL','BR'],mods=['','\''];
  const o=[];let last=-1;
  for(let i=0;i<70;i++){
    let a;do a=Math.random()*faces.length|0;while(a===last);
    last=a;
    o.push(faces[a]+mods[Math.random()*2|0]+(Math.random()<.5?'2':''));
  }
  return o.join(' ');
}
/* ========== Local scramble generators (offline, no CDN) ========== */
/*
 * 222: exact random-state (uniform over reachable positions)
 * 333/OH/BLD: near-uniform HTM mixer (25 moves, WCA face-axis rules)
 *   — true optimal random-state needs large pruning tables/workers;
 *     this is the standard offline practice approach and mixes the cube well.
 * Others: event-specific random-move generators
 */
const RS222=(function(){
  function id(){return{cp:[0,1,2,3,4,5,6,7],co:[0,0,0,0,0,0,0,0]}}
  function cpy(c){return{cp:c.cp.slice(),co:c.co.slice()}}
  const CCP=[[3,0,1,2,4,5,6,7],[4,1,2,0,7,5,6,3],[1,5,2,3,0,4,6,7]];
  const CCO=[[0,0,0,0,0,0,0,0],[2,0,0,1,1,0,0,2],[1,2,0,0,2,1,0,0]];
  function mov(c,f){const o=cpy(c),cp=CCP[f],co=CCO[f];for(let i=0;i<8;i++){o.cp[i]=c.cp[cp[i]];o.co[i]=(c.co[cp[i]]+co[i])%3}return o}
  function movN(c,f,n){let x=c;for(let i=0;i<n;i++)x=mov(x,f);return x}
  function parity(a){let p=0;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i]>a[j])p^=1;return p}
  function solved(c){for(let i=0;i<8;i++)if(c.cp[i]!==i||c.co[i])return false;return true}
  function key(c){return c.cp.join('')+c.co.join('')}
  function randomState(){
    // 2x2 with fixed orientation: any CP is reachable; only CO sum ≡ 0 (mod 3)
    const c=id();
    for(let i=7;i>0;i--){const j=Math.random()*(i+1)|0;[c.cp[i],c.cp[j]]=[c.cp[j],c.cp[i]]}
    let s=0;for(let i=0;i<7;i++){c.co[i]=Math.random()*3|0;s+=c.co[i]}c.co[7]=(3-s%3)%3;
    return c;
  }
  const MN=['U','U2',"U'",'R','R2',"R'",'F','F2',"F'"];
  function invM(m){return(m/3|0)*3+(2-(m%3))}
  function expand(start, depth){
    const map=new Map(); // key -> move list from start
    map.set(key(start), []);
    let frontier=[{c:start,path:[]}];
    for(let d=0;d<depth;d++){
      const next=[];
      for(const {c,path} of frontier){
        const last=path.length?path[path.length-1]:-1;
        const lf=last<0?-1:(last/3|0);
        for(let f=0;f<3;f++){
          if(f===lf)continue;
          for(let p=1;p<=3;p++){
            const nc=movN(c,f,p), nk=key(nc);
            if(map.has(nk))continue;
            const np=path.concat(f*3+(p-1));
            map.set(nk,np);
            next.push({c:nc,path:np});
          }
        }
      }
      frontier=next;
    }
    return map;
  }
  function scramble(){
    const st=randomState();
    if(solved(st))return sc([['R'],['U'],['F']],M3,9);
    const fwd=expand(st,6);
    const bwd=expand(id(),6);
    let best=null;
    for(const [k,fp] of fwd){
      if(!bwd.has(k))continue;
      const bp=bwd.get(k);
      const sol=fp.concat(bp.slice().reverse().map(invM));
      if(!best||sol.length<best.length)best=sol;
    }
    if(best&&best.length){
      // scramble = inv(solution)
      return best.slice().reverse().map(m=>MN[invM(m)]).join(' ');
    }
    // Fallback mixer
    return sc([['R'],['U'],['F']],M3,11);
  }
  return{scramble};
})();

/* 3x3 near-uniform random-move (HTM, no consecutive same face, axis order) */
function scramble333RS(){
  const faces=['U','D','R','L','F','B'];
  const axisOf=[0,0,1,1,2,2]; // U D / R L / F B
  const mods=['','2',"'"];
  const out=[];
  let prevFace=-1, prevAxis=-1, prev2Axis=-1;
  const len=25;
  for(let i=0;i<len;i++){
    let f, tries=0;
    do{
      f=Math.random()*6|0;
      tries++;
      // avoid same face, prefer different axis than previous when possible,
      // and reduce long same-axis sequences
    }while(tries<40 && (f===prevFace || (axisOf[f]===prevAxis && f<prevFace) || (axisOf[f]===prevAxis && prevAxis===prev2Axis)));
    prev2Axis=prevAxis;
    prevAxis=axisOf[f];
    prevFace=f;
    out.push(faces[f]+mods[Math.random()*3|0]);
  }
  return out.join(' ');
}

function invAlg(alg){
  const toks=alg.replace(/[()]/g,' ').trim().split(/\s+/).filter(Boolean);
  const inv=[];
  for(let i=toks.length-1;i>=0;i--){
    const t=toks[i];
    if(t.endsWith('2'))inv.push(t);
    else if(t.endsWith("'"))inv.push(t.slice(0,-1));
    else inv.push(t+"'");

}

/* Offline 2D scramble net (no CDN required) */
// Standard Western color scheme: R red, L orange (distinct)
const FACE_COLORS={U:'#ffffff',R:'#c41e3a',F:'#009b48',D:'#ffd500',L:'#ff5800',B:'#0051ba'};
function solvedFacelets(n){
  const faces='URFDLB', out={};
  for(const f of faces) out[f]=Array(n*n).fill(f);
  return out;
}
function faceRot(face,n,cw){
  const a=face.slice(), b=Array(n*n);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const i=r*n+c;
    const j=cw?(c*n+(n-1-r)):((n-1-c)*n+r);
    b[j]=a[i];
  }
  return b;
}
// side: 0=top L→R, 1=right T→B, 2=bottom L→R, 3=left T→B (face-local)
function getStrip(face,side,n){
  const s=[];
  if(side===0){for(let c=0;c<n;c++)s.push(face[c])}
  else if(side===1){for(let r=0;r<n;r++)s.push(face[r*n+(n-1)])}
  else if(side===2){for(let c=0;c<n;c++)s.push(face[(n-1)*n+c])}
  else {for(let r=0;r<n;r++)s.push(face[r*n])}
  return s;
}
function setStrip(face,side,n,vals){
  let i=0;
  if(side===0){for(let c=0;c<n;c++)face[c]=vals[i++]}
  else if(side===1){for(let r=0;r<n;r++)face[r*n+(n-1)]=vals[i++]}
  else if(side===2){for(let c=0;c<n;c++)face[(n-1)*n+c]=vals[i++]}
  else {for(let r=0;r<n;r++)face[r*n]=vals[i++]}
}
function rev(a){return a.slice().reverse()}
/*
 * CW adjacent cycles. Each: [face, side, flip]
 * flip=true → reverse strip when reading into the cycle buffer so edge
 * directions match between faces that meet at 90°/180°.
 */
const ADJ={
  U:[['F',0,false],['R',0,false],['B',0,true],['L',0,true]],
  D:[['F',2,true],['L',2,false],['B',2,false],['R',2,true]],
  R:[['U',1,false],['B',3,true],['D',1,true],['F',1,false]],
  L:[['U',3,false],['F',3,false],['D',3,true],['B',1,true]],
  F:[['U',2,false],['R',3,false],['D',0,true],['L',1,true]],
  B:[['U',0,true],['L',3,true],['D',2,false],['R',1,false]]
};
function applyMove(state,n,face,pow){
  const turns=((pow%4)+4)%4;
  for(let t=0;t<turns;t++){
    state[face]=faceRot(state[face],n,true);
    const cyc=ADJ[face];
    if(!cyc)continue;
    const strips=cyc.map(([f,s,flip])=>{
      const raw=getStrip(state[f],s,n);
      return flip?rev(raw):raw;
    });
    for(let i=0;i<4;i++){
      const [f,s,flip]=cyc[i];
      let vals=strips[(i+3)%4];
      if(flip) vals=rev(vals);
      setStrip(state[f],s,n,vals);
    }
  }
}
function parseMoves(scr){
  // basic SiGN-like tokens: R, R', R2, Rw, 3Rw', etc. Outer-layer focus for display
  const toks=scr.replace(/[()]/g,' ').trim().split(/\s+/).filter(Boolean);
  const out=[];
  for(const t of toks){
    const m=t.match(/^(\d*)([URFDLB])(w?)([2']?)$/i);
    if(!m)continue;
    const face=m[2].toUpperCase();
    const wide=!!m[3];
    // ignore wide/inner for simple net (still rotate outer face for visual)
    let pow=1;
    if(m[4]==="2")pow=2;
    else if(m[4]==="'")pow=3;
    out.push([face,pow]);
  }
  return out;
}
function scrambleState(n,scr){
  const st=solvedFacelets(n);
  for(const [face,pow] of parseMoves(scr)){
    if(st[face])applyMove(st,n,face,pow);
  }
  return st;
}
function eventSize(ev){
  if(ev==='222')return 2;
  if(ev==='444')return 4;
  if(ev==='555')return 5;
  if(ev==='666')return 6;
  if(ev==='777')return 7;
  return 3; // 333 / oh / bld / others approximate
}
function drawNet(canvas,state,n){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const gap=1;
  const cell=Math.floor(Math.min((W-4)/(4*n),(H-4)/(3*n)));
  if(cell<2)return;
  const netW=4*n*cell, netH=3*n*cell;
  const ox=Math.floor((W-netW)/2), oy=Math.floor((H-netH)/2);
  // layout:  . U .
  //        L F R B
  //          D
  const pos={
    U:[n,0], R:[2*n,n], F:[n,n], D:[n,2*n], L:[0,n], B:[3*n,n]
  };
  for(const f of 'URFDLB'){
    const [px,py]=pos[f];
    const stickers=state[f];
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      const col=FACE_COLORS[stickers[r*n+c]]||'#888';
      const x=ox+(px+c)*cell, y=oy+(py+r)*cell;
      ctx.fillStyle=col;
      ctx.fillRect(x+gap,y+gap,cell-gap*2,cell-gap*2);
      ctx.strokeStyle='rgba(0,0,0,.25)';
      ctx.lineWidth=1;
      ctx.strokeRect(x+gap,y+gap,cell-gap*2,cell-gap*2);
    }
  }
}
function updateScrambleImage(scramble,allowEmpty){
  const box=$('#simg');

  }
}

function setS(s,sub){pad.dataset.s=s;if(sub!==undefined)SUB.textContent=sub}
const hint=()=>{
  if(S.set.man)return'Type your time below';
  if(useInspection())return'Press and release to start inspection';
  const n=phaseCount();
  if(n>1)return`Hold until green · ${n} phases (space advances)`;
  return'Hold space or the pad until it turns green, then release';
};
function fmtRun(ms){
  const mode=S.set.hide?'hide':(S.set.timeU||'full');
  if(mode==='hide')return'…';
  if(mode==='1')return String(Math.floor(ms/1000));
  if(mode==='0.1'){
    const t=Math.floor(ms/100)/10;
    return t.toFixed(1);
  }
  return fmt(ms);
}
function tick(){
  if(st==='run'){
    const n=phaseCount();
    const elapsed=performance.now()-(n>1?totalT0:t0);
    const phaseEl=performance.now()-phaseT0;
    const hidden=S.set.hide||S.set.timeU==='hide';
    T.textContent=fmtRun(elapsed);
    if(n>1&&!hidden){
      const lab=phaseLabel(phaseIdx,n);
      SUB.textContent=`${lab} · split ${fmt(phaseEl)} · ${phaseIdx+1}/${n}`;
    }
    const tgt=+getOpt('target')||0;
    if(tgt>0&&!hidden){
      const ok=elapsed<=tgt*1000;
      T.style.color=ok?'':'var(--org)';
    }else if(n<=1) T.style.color='';
  }
  else if(st==='insp'){
    const el=(performance.now()-i0)/1000;
    if(el>=8&&!b8){b8=1;beep(660,.15);speak('8')}
    if(el>=12&&!b12){b12=1;beep(880,.3);speak('12')}
    if(!holding||!armed)T.textContent=el<15?Math.ceil(15-el):el<17?'+2':'DNF';
  }else return;
  raf=requestAnimationFrame(tick);
}
function down(){
  if(st==='run'){stop();return}
  if(S.set.man||(st!=='idle'&&st!=='insp'))return;
  holding=true;armed=false;
  if(st==='idle'&&useInspection())return setS('hold');
  setS('hold');
  clearTimeout(ht);
  const holdMs=+S.set.hold||300;
  ht=setTimeout(()=>{if(holding){armed=true;setS('ready')}},holdMs);
}
function up(){
  if(!holding)return;
  holding=false;clearTimeout(ht);
  if(st==='idle'&&useInspection()){
    st='insp';i0=performance.now();b8=b12=0;
    setS('insp','Hold, then release to start solving');
    document.body.classList.add('running');
    stopScrPlay();
    updateScramHelper();
    tick();
  }else if(armed)start();
  else setS(st==='insp'?'insp':'idle');
}
function start(){
  cancelAnimationFrame(raf);pen=0;
  if(st==='insp'){
    const el=(performance.now()-i0)/1000;
    pen=el>17?-1:el>15?2000:0;
  }
  const now=performance.now();
  st='run';t0=now;totalT0=now;phaseT0=now;
  phaseIdx=0;phaseSplits=[];
  document.body.classList.add('running');
  stopScrPlay();
  updateScramHelper();
  const n=phaseCount();
  setS('run',n>1?`${phaseLabel(0,n)} · 1/${n}`:'');
  tick();
}
function stop(forceEnd){
  if(st!=='run')return;
  const n=phaseCount();
  const now=performance.now();
  const splitMs=Math.floor(now-phaseT0);
  phaseSplits.push(splitMs);
  if(!forceEnd&&n>1&&phaseIdx<n-1){
    // advance to next phase
    phaseIdx++;
    phaseT0=now;
    if(S.set.phaseBeep!==false&&S.set.stopSnd!==false)beep(700,.07);
    setS('run',`${phaseLabel(phaseIdx,n)} · ${phaseIdx+1}/${n}`);
    // keep running — do not call add yet
    return;
  }
  // final phase, single-phase, or forced end (e.g. smart cube solved)
  cancelAnimationFrame(raf);
  const t=Math.floor(now-totalT0);
  st='idle';
  document.body.classList.remove('running');
  setS('idle',hint());
  add(t,pen,scrs[si],phaseSplits.slice());
  phaseIdx=0;phaseSplits=[];
  if(S.set.autoScr!==false){
    try{newScr()}catch(_){}
  }
}
function add(t,p,scr,splits){
  const s=ss(),v=s.solves.map(E),pb=bestAo(v,1),pa5=bestAo(v,5),pa12=bestAo(v,12);
  const noteTrain=(S.set.mode&&S.set.mode!=='timer'&&trainCase)?(trainCase.code||''):'';
  const entry={t,pen:p,scr,ts:Date.now(),note:noteTrain||''};
  if(splits&&splits.length>1)entry.splits=splits;
  s.solves.push(entry);
  // training counter
  if(S.set.mode&&S.set.mode!=='timer'){
    S.set.trainCount=(S.set.trainCount||0)+1;
  }
  const v2=s.solves.map(E),n=v2.length-1;
  const a5=ao(v2,5),a12=ao(v2,12);
  const bits=[];
  const isPbSingle=p>=0&&(pb===null||v2[n]<pb);
  if(isPbSingle)bits.push('PB single');
  if(a5!==null&&isFinite(a5)&&(pa5===null||a5<pa5))bits.push('PB ao5');
  if(a12!==null&&isFinite(a12)&&(pa12===null||a12<pa12))bits.push('PB ao12');
  let msg=bits.join(' · ');
  if(!msg){
    const parts=[fs(s.solves[n])];
    if(a5!==null)parts.push('ao5 '+fmt(a5));
    if(a12!==null)parts.push('ao12 '+fmt(a12));
    const tgt=+getOpt('target')||0;
    if(tgt>0&&p>=0){
      const under=v2[n]<=tgt*1000;
      parts.push(under?'under target':'over target');
    }
    msg=parts.join(' · ');
  }
  // stop / PB sounds
  if(S.set.stopSnd){
    if(bits.length){beep(880,.08);setTimeout(()=>beep(1175,.12),90)}
    else beep(520,.06);
  }
  save();
  if(S.set.autoBackup&&s.solves.length&&s.solves.length%50===0){
    try{downloadBackup('auto')}catch(_){}
  }
  render();
  const tgt2=+getOpt('target')||0;
  if(tgt2>0&&p>=0) T.style.color=v2[n]<=tgt2*1000?'var(--grn)':'var(--org)';
  toast(msg);
}
function undoLast(){
  const s=ss();
  if(!s.solves.length)return toast('Nothing to undo');
  const removed=s.solves.pop();
  save();render();
  toast('Undid '+fs(removed));
}
function stdDev(arr){
  const fin=arr.filter(isFinite);
  if(fin.length<2)return null;
  const m=mean(fin);
  return Math.sqrt(fin.reduce((s,x)=>s+(x-m)*(x-m),0)/(fin.length-1));
}
function toast(m,ms){
  const e=$('#toast');
  e.textContent=m;e.classList.add('show');
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>e.classList.remove('show'),ms||2800);
}
function toggleTheater(force){
  S.set.theater=typeof force==='boolean'?force:!S.set.theater;
  save();
  render();
  toast(S.set.theater?'Theater on · press T to exit':'Theater off');
}
function copyScramble(){
  const t=scrs[si]||'';
  if(!t)return toast('No scramble');
  copy(t);
}

/* input */
const typing=e=>/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||$('#dg').open;
addEventListener('keydown',e=>{
  if(typing(e)){if(e.target.id==='man'&&e.key==='Enter')manual();return}
  if(e.key==='Escape'){
    if(st==='insp'){
      st='idle';
      cancelAnimationFrame(raf);
      holding=false;armed=false;clearTimeout(ht);
      phaseIdx=0;phaseSplits=[];
      document.body.classList.remove('running');
      T.style.color='';
      setS('idle',hint());
      render();
    }
    else if(st==='run'){
      // cancel in-progress solve (including multi-phase) without recording
      cancelAnimationFrame(raf);
      st='idle';
      holding=false;armed=false;clearTimeout(ht);
      phaseIdx=0;phaseSplits=[];
      document.body.classList.remove('running');
      T.style.color='';
      setS('idle',hint());
      render();
      toast('Solve cancelled');
    }
    else if($('#dg').open)$('#dg').close();
    return;
  }
  if(st==='run'&&!['Shift','Control','Alt','Meta'].includes(e.key)){
    const sk=S.set.stopKey||'any';
    const isSpace=e.code==='Space'||e.key===' ';
    const isLetter=/^[a-zA-Z]$/.test(e.key);
    const ok=sk==='any'||(sk==='space'&&isSpace)||(sk==='letters'&&(isSpace||isLetter));
    if(ok){e.preventDefault();stop();return}
  }
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)down()}
  // Both-Ctrl Stackmat-style: both Ctrl keys held → arm; release either after armed → start
  if(S.set.dualCtrl&&(e.code==='ControlLeft'||e.code==='ControlRight')){
    if(e.code==='ControlLeft')ctrlL=true;
    if(e.code==='ControlRight')ctrlR=true;
    if(ctrlL&&ctrlR&&(st==='idle'||st==='insp')&&!holding){e.preventDefault();down()}
  }
  if(e.key==='?'||(e.shiftKey&&e.key==='/')){e.preventDefault();openHelp()}
  // Idle hotkeys
  if(st==='idle'||st==='ready'){
    if(e.key==='n'||e.key==='N'){e.preventDefault();$('#next').click()}
    if(e.key==='c'||e.key==='C'){e.preventDefault();copyScramble()}
    if(e.key==='h'||e.key==='H'){
      e.preventDefault();
      if(trainCase&&trainCase.alg){S.set.showAlg=true;save();updateCaseBar()}
    }
    if(e.key==='p'||e.key==='P'){e.preventDefault();if(si>0){si--;showScr()}}
    if(e.key==='u'||e.key==='U'){e.preventDefault();undoLast()}
    if(e.key==='2'&&!e.shiftKey){ // +2 on last
      e.preventDefault();
      const s=ss(),x=s.solves[s.solves.length-1];
      if(x){x.pen=x.pen===2000?0:2000;save();render();toast(x.pen?'+2 applied':'+2 removed')}
    }
    if(e.key==='d'||e.key==='D'){ // DNF toggle
      e.preventDefault();
      const s=ss(),x=s.solves[s.solves.length-1];
      if(x){x.pen=x.pen<0?0:-1;save();render();toast(x.pen<0?'DNF':'DNF cleared')}
    }
    if(e.key==='t'||e.key==='T'){ // toggle theater
      e.preventDefault();
      toggleTheater();
    }
    if(S.set.scrHelp&&scrTokens.length){
      if(e.key==='ArrowRight'||e.key==='.'){e.preventDefault();setScrStep(scrStep+1)}
      if(e.key==='ArrowLeft'||e.key===','){e.preventDefault();setScrStep(scrStep-1)}
      if(e.key==='Home'){e.preventDefault();setScrStep(0)}
      if(e.key==='End'){e.preventDefault();setScrStep(scrTokens.length)}
    }
  }
});
addEventListener('keyup',e=>{
  if(typing(e))return;
  if(e.code==='Space'){e.preventDefault();up();return}
  if(S.set.dualCtrl&&(e.code==='ControlLeft'||e.code==='ControlRight')){
    const wasBoth=ctrlL&&ctrlR;
    if(e.code==='ControlLeft')ctrlL=false;
    if(e.code==='ControlRight')ctrlR=false;
    if(wasBoth&&(holding||armed||st==='ready'||st==='hold')){e.preventDefault();up()}
  }
});
addEventListener('pointerdown',e=>{
  if(st==='run'){e.preventDefault();stop()}
  else if(pad.contains(e.target)&&e.target.id!=='man')down();
});
addEventListener('pointerup',up);
addEventListener('pointercancel',up);
addEventListener('beforeunload',e=>{
  if(st==='run'||st==='insp'){e.preventDefault();e.returnValue=''}
});
function parseT(x){
  x=x.trim().toLowerCase();
  if(x==='dnf')return -1;
  const m=x.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  return m?Math.round(((+m[1]||0)*60+ +m[2])*1000):null;
}
function manual(){
  const i=$('#man'),v=parseT(i.value);
  if(v===null)return toast('Enter a time like 12.34 or 1:02.5');
  i.value='';
  v<0?add(0,-1,scrs[si]):add(v,0,scrs[si]);
}


/* appearance */
const THEMES=[
  ['auto','Auto'],['light','Light'],['dark','Dark'],['midnight','Midnight'],
  ['forest','Forest'],['sunset','Sunset'],['ocean','Ocean'],['mono','Mono'],
  ['terminal','Terminal'],['rose','Rose'],['slate','Slate']
];
const FONTS=[
  ['default',"Default", "'Bricolage Grotesque',system-ui,sans-serif", "'Chivo Mono',ui-monospace,monospace"],
  ['inter',"Inter + JetBrains", "'Inter',system-ui,sans-serif", "'JetBrains Mono',ui-monospace,monospace"],
  ['space',"Space Grotesk + IBM", "'Space Grotesk',system-ui,sans-serif", "'IBM Plex Mono',ui-monospace,monospace"],
  ['outfit',"Outfit + Roboto Mono", "'Outfit',system-ui,sans-serif", "'Roboto Mono',ui-monospace,monospace"],
  ['plex',"IBM Plex", "'IBM Plex Sans',system-ui,sans-serif", "'IBM Plex Mono',ui-monospace,monospace"],
  ['system',"System", "system-ui,-apple-system,sans-serif", "ui-monospace,SFMono-Regular,Menlo,monospace"]
];
const SIZES=[['compact','Compact'],['normal','Normal'],['large','Large'],['huge','Huge']];
function resolvedTheme(){
  const th=S.set.theme||'auto';
  if(th!=='auto')return th;
  return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
}
function isDarkTheme(th){
  return ['dark','midnight','sunset','terminal'].includes(th)||(th==='auto'&&resolvedTheme()==='dark');
}
function applyAppearance(){
  const root=document.documentElement;
  const th=S.set.theme||'auto';
  if(th==='auto')root.removeAttribute('data-theme');
  else root.dataset.theme=th;
  const sz=S.set.size||'normal';
  root.dataset.size=sz;
  const f=FONTS.find(x=>x[0]===(S.set.font||'default'))||FONTS[0];
  root.style.setProperty('--font-ui',f[2]);
  root.style.setProperty('--font-mono',f[3]);
  // Custom color overrides (empty = use theme)
  const map=[['colBg','--bg'],['colPan','--pan'],['colInk','--ink'],['colBlu','--blu']];
  for(const [k,css] of map){
    const v=S.set[k];
    if(v)root.style.setProperty(css,v);
    else root.style.removeProperty(css);
  }
  // Background image
  const bg= (S.set.bgImg||'').trim();
  if(bg){
    document.body.style.backgroundImage=`url("${bg.replace(/"/g,'')}")`;
    document.body.classList.add('has-bg');
  }else{
    document.body.style.backgroundImage='';
    document.body.classList.remove('has-bg');
  }
  // Sync browser chrome / form controls
  const dark=isDarkTheme(th);
  root.style.colorScheme=dark?'dark':'light';
  const meta=$('meta[name="theme-color"]');
  if(meta){
    const bgc=getComputedStyle(root).getPropertyValue('--bg').trim()||(dark?'#12162a':'#eef0f6');
    meta.setAttribute('content',bgc);
  }
  const ts=$('#themeSel'),fs=$('#fontSel'),ss=$('#sizeSel');
  if(ts){ts.innerHTML=THEMES.map(([k,l])=>`<option value="${k}"${k===th?' selected':''}>${l}</option>`).join('')}
  if(fs){fs.innerHTML=FONTS.map(([k,l])=>`<option value="${k}"${k===(S.set.font||'default')?' selected':''}>${l}</option>`).join('')}
  if(ss){ss.innerHTML=SIZES.map(([k,l])=>`<option value="${k}"${k===sz?' selected':''}>${l}</option>`).join('')}
  // Sync color inputs (read computed if custom empty)
  const computed=getComputedStyle(root);
  const hex=v=>{
    v=(v||'').trim();
    if(/^#/.test(v))return v.length===4?('#'+[v[1],v[1],v[2],v[2],v[3],v[3]].join('')):v.slice(0,7);
    const m=v.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if(m)return'#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join('');
    return '#888888';
  };
  if($('#colBg')&&document.activeElement!==$('#colBg'))$('#colBg').value=hex(S.set.colBg||computed.getPropertyValue('--bg'));
  if($('#colPan')&&document.activeElement!==$('#colPan'))$('#colPan').value=hex(S.set.colPan||computed.getPropertyValue('--pan'));
  if($('#colInk')&&document.activeElement!==$('#colInk'))$('#colInk').value=hex(S.set.colInk||computed.getPropertyValue('--ink'));
  if($('#colBlu')&&document.activeElement!==$('#colBlu'))$('#colBlu').value=hex(S.set.colBlu||computed.getPropertyValue('--blu'));
  if($('#bgImg')&&document.activeElement!==$('#bgImg'))$('#bgImg').value=S.set.bgImg||'';
  const tb=$('#theme');
  if(tb){
    const label=th==='auto'?'◐ Auto':th==='light'?'☀ Light':th==='dark'?'☾ Dark':'Theme: '+(THEMES.find(x=>x[0]===th)||['','?'])[1];
    tb.textContent=label;
    tb.title='Theme: '+(THEMES.find(x=>x[0]===th)||[th,th])[1]+' — click to cycle Auto / Light / Dark';
  }
}

function drawSpark(v){
  const card=$('#sparkCard'),c=$('#sparkCv');
  if(!card||!c)return;
  if(!S.set.spark){card.hidden=true;return}
  const fin=v.filter(isFinite);
  if(fin.length<2){card.hidden=true;return}
  card.hidden=false;
  const d=devicePixelRatio||1,W=c.clientWidth||320,H=72;
  c.width=W*d;c.height=H*d;
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);
  g.clearRect(0,0,W,H);
  const pts=fin.slice(-40);
  const lo=Math.min(...pts),hi=Math.max(...pts)||1;
  const pad=6;
  const X=i=>pad+i*(W-pad*2)/Math.max(1,pts.length-1);
  const Y=t=>H-pad-((t-lo)/((hi-lo)||1))*(H-pad*2);
  const css=getComputedStyle(document.documentElement);
  const blu=css.getPropertyValue('--blu').trim()||'#5b93ff';
  const mute=css.getPropertyValue('--mute').trim()||'#888';
  // mean line
  const m=pts.reduce((a,b)=>a+b,0)/pts.length;
  g.strokeStyle=mute;g.lineWidth=1;g.setLineDash([3,3]);
  g.beginPath();g.moveTo(pad,Y(m));g.lineTo(W-pad,Y(m));g.stroke();g.setLineDash([]);
  g.strokeStyle=blu;g.lineWidth=2;g.beginPath();
  pts.forEach((t,i)=>{i?g.lineTo(X(i),Y(t)):g.moveTo(X(i),Y(t))});
  g.stroke();
  g.fillStyle=blu;
  const last=pts.length-1;
  g.beginPath();g.arc(X(last),Y(pts[last]),3,0,7);g.fill();
}

/* render */
function render(){
  const s=ss(),v=s.solves.map(E);
  $('#sess').innerHTML=S.sessions.map(x=>`<option value="${x.id}"${x.id===s.id?' selected':''}>${esc(x.name)} (${x.solves.length})</option>`).join('');
  $('#ev').innerHTML=Object.entries(EV).map(([k,e])=>`<option value="${k}"${k===s.event?' selected':''}>${e[0]}</option>`).join('');
  const mode=S.set.mode||'timer';
  const ms=$('#mode');
  if(ms)ms.innerHTML=MODES.map(([k,l])=>`<option value="${k}"${k===mode?' selected':''}>${l}</option>`).join('');
  document.body.classList.toggle('cfop',(S.set.method||'timer')!=='timer');
  document.body.classList.toggle('theater',!!S.set.theater);
  for(const k of['hide','ms','snd','voice','stopSnd','phaseBeep','autoScr','confirm','spark','perSess','scrHelp','dualCtrl','animScr','autoBackup'])if($('#'+k))$('#'+k).checked=!!S.set[k];
  if($('#profileName')&&document.activeElement!==$('#profileName'))$('#profileName').value=S.set.profileName||'';
  $('#mn').checked=S.set.man;
  $('#img').checked=S.set.img;
  if($('#theater'))$('#theater').checked=!!S.set.theater;
  const im=$('#inspMode');
  if(im)im.value=getOpt('inspMode')||(S.set.insp?'always':'off');
  const hs=$('#holdSel');
  if(hs)hs.value=String(S.set.hold||300);
  const ps=$('#phaseSel');
  if(ps)ps.value=String((getOpt('phases')??S.set.phases)||1);
  const tu=$('#timeU');
  if(tu)tu.value=S.set.timeU||'full';
  const sk=$('#stopKey');
  if(sk)sk.value=S.set.stopKey||'any';
  const ti=$('#targetIn');
  const tgt=+getOpt('target')||0;
  if(ti&&document.activeElement!==ti)ti.value=tgt>0?tgt:'';
  const sr=$('#statRows');
  if(sr&&document.activeElement!==sr){
    const sel=new Set(S.set.statRows||[]);
    sr.innerHTML=STAT_DEFS.map(([k,l])=>`<option value="${k}"${sel.has(k)?' selected':''}>${l}</option>`).join('');
  }
  document.body.classList.toggle('manual',S.set.man);
  applyAppearance();
  const f=x=>x===null?'–':fmt(x),ok=v.filter(isFinite);
  const row=(n,c,b)=>`<span>${n}</span><b>${f(c)}</b><b>${f(b)}</b>`;
  const sd=stdDev(v);
  const enabled=new Set(S.set.statRows&&S.set.statRows.length?S.set.statRows:STAT_DEFS.map(x=>x[0]));
  let statsHtml=`<span></span><span class="h">current</span><span class="h">best</span>`;
  for(const [k,label,n] of STAT_DEFS){
    if(!enabled.has(k))continue;
    if(k==='single')statsHtml+=row(label,v.length?v[v.length-1]:null,bestAo(v,1));
    else if(k==='mean')statsHtml+=`<span>${label}</span><b>${ok.length?f(mean(ok)):'–'}</b><b></b>`;
    else if(k==='sd')statsHtml+=`<span>${label}</span><b>${sd!==null?f(sd):'–'}</b><b></b>`;
    else if(k==='n')statsHtml+=`<span>${label}</span><b>${v.length}</b><b></b>`;
    else if(n>0)statsHtml+=row(label,ao(v,n),bestAo(v,n));
  }
  $('#stats').innerHTML=statsHtml;
  drawSpark(v);
  const L=$('#list');
  if(!v.length){
    L.innerHTML='<div class="list-head"><span>#</span><span>time</span><span>ao5</span><span>ao12</span></div><div class="list-body"><div class="empty">No solves yet. Hold space and release to start.</div></div>';
  }else{
    const pb=bestAo(v,1);
    let h='';
    for(let i=v.length-1;i>=Math.max(0,v.length-300);i--){
      const w=v.slice(0,i+1),a5=ao(w,5),a12=ao(w,12);
      const isPb=isFinite(v[i])&&v[i]===pb;

/* Bluetooth — GAN (gan-web-bluetooth), optimized pairing */
let btConn=null,btKind=null,btSub=null,btMoveCount=0,btBusy=false;
let ganConnectFn=null,ganLoadPromise=null,btLastName='';
const SOLVED_FACELETS='UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB';
const BT_MAC_KEY='cubetimer.ganMac.last';
const BT_NAME_KEY='cubetimer.btLastName';
function setBtUi(connected,name,status){
  const b=$('#bt');
  if(!b)return;

    b.textContent=status;

    b.style.borderColor='var(--grn)';

    let last='';
    try{last=localStorage.getItem(BT_NAME_KEY)||''}catch(_){}
    b.textContent='BT';
    b.title=last?`Reconnect ${last} (Chrome/Edge + HTTPS)`:'Connect smart cube (Chrome/Edge + HTTPS/localhost)';
    b.style.borderColor='';

}
function btStartFromMove(){
  if(st==='idle'&&!S.set.man){
    pen=0;

function onGanEvent(ev){
  if(!ev)return;

  else if(ev.type==='FACELETS'&&st==='run'&&ev.facelets&&ev.facelets===SOLVED_FACELETS)stop(true);
  else if(ev.type==='DISCONNECT'){

  }
}
function onCubingMove(e){

    const pat=e&&e.pattern;

}
async function disconnectBt(){
  try{if(btSub&&typeof btSub.unsubscribe==='function')btSub.unsubscribe()}catch(_){}
  try{
    if(btConn){
      if(btKind==='gan'&&btConn.disconnect)await btConn.disconnect();
      else if(btKind==='cubing'&&btConn.disconnect)btConn.disconnect();
    }
  }catch(_){}
  btConn=null;btKind=null;btSub=null;btSub=null;
  setBtUi(false);
}
function normalizeMac(mac){
  if(!mac)return '';
  const clean=String(mac).trim().toUpperCase().replace(/-/g,':').replace(/[^0-9A-F:]/g,'');
  return /^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(clean)?clean:'';
}
/* Prefer saved MAC (no prompt). Only prompt when library requires it and nothing saved. */
async function ganMacProvider(device,isFallback){
  const idKey='cubetimer.ganMac.'+(device&&device.id||'unknown');
  let saved='';
  try{saved=localStorage.getItem(idKey)||localStorage.getItem(BT_MAC_KEY)||''}catch(_){}
  saved=normalizeMac(saved);
  // Auto-use cached MAC whenever possible (faster re-pair)
  if(saved){
    try{localStorage.setItem(idKey,saved);localStorage.setItem(BT_MAC_KEY,saved)}catch(_){}
    return saved;
  }
  if(!isFallback)return null;
  const mac=prompt(
    'Enter this GAN cube MAC (CubeStation / box), e.g. AA:BB:CC:DD:EE:FF\n\nSaved after first success — only needed once.',
    ''
  );
  const clean=normalizeMac(mac);
  if(!clean){
    if(mac)toast('Invalid MAC format (use AA:BB:CC:DD:EE:FF)');
    return null;
  }
  try{
    localStorage.setItem(idKey,clean);
    localStorage.setItem(BT_MAC_KEY,clean);
  }catch(_){}
  return clean;
}
async function loadGanConnect(){
  if(ganConnectFn)return ganConnectFn;
  if(ganLoadPromise)return ganLoadPromise;
  ganLoadPromise=(async()=>{
    const urls=[
      'https://esm.sh/gan-web-bluetooth@3.0.2',
      'https://cdn.jsdelivr.net/npm/gan-web-bluetooth@3.0.2/+esm',
      'https://unpkg.com/gan-web-bluetooth@3.0.2/dist/index.js'
    ];
    for(const url of urls){
      try{
        const mod=await import(url);
        const fn=mod.connectGanCube||(mod.default&&mod.default.connectGanCube)||mod.default;
        if(typeof fn==='function'){
          ganConnectFn=fn;
          return fn;
        }
      }catch(e){console.warn('GAN import failed',url,e)}
    }
    return null;
  })();
  try{return await ganLoadPromise}
  finally{/* keep cache */}
}
// Preload library in background after first paint
function preloadBtLib(){
  if(!window.isSecureContext||!navigator.bluetooth)return;
  if(ganConnectFn||ganLoadPromise)return;
  const run=()=>loadGanConnect().catch(()=>{});
  if('requestIdleCallback' in window)requestIdleCallback(run,{timeout:4000});
  else setTimeout(run,1500);
}
function withTimeout(promise,ms,label){
  let to;
  const t=new Promise((_,rej)=>{to=setTimeout(()=>rej(new Error(label||'Connection timed out')),ms)});
  return Promise.race([promise,t]).finally(()=>clearTimeout(to));
}
function errMsg(err){
  if(!err)return 'Unknown error';
  if(err.name==='NotFoundError')return 'No device selected';
  if(err.name==='SecurityError')return 'Bluetooth blocked (need HTTPS or localhost)';
  if(err.name==='NetworkError')return 'Cube disconnected during setup';
  if(err.name==='InvalidStateError')return 'Bluetooth busy — try again';
  if(err.name==='NotSupportedError')return 'Cube not supported in this browser';
  const m=String(err.message||err);
  if(/timed out|timeout/i.test(m))return 'Connection timed out — hold cube near PC and retry';
  if(/MAC|mac address/i.test(m))return 'MAC needed — enter it when prompted (saved for next time)';
  if(/service|unsupported/i.test(m))return 'Unsupported cube model/firmware';
  return m.slice(0,120);
}
async function finishGanConnect(conn){
  btConn=conn;btKind='gan';
  const name=conn.deviceName||(conn.device&&conn.device.name)||btLastName||'GAN cube';
  btLastName=name;
  try{localStorage.setItem(BT_NAME_KEY,name)}catch(_){}
  setBtUi(true,name);
  toast('Connected: '+name);
  if(conn.events$&&conn.events$.subscribe)btSub=conn.events$.subscribe(onGanEvent);
  // Warm up facelets so first solve detect is fast
  try{await conn.sendCubeCommand({type:'REQUEST_FACELETS'})}catch(_){}
  try{if(conn.sendCubeCommand)await conn.sendCubeCommand({type:'REQUEST_HARDWARE_INFO'})}catch(_){}
}
async function toggleBt(){
  if(btBusy)return;
  if(btConn){
    await disconnectBt();
    toast('Bluetooth disconnected');
    return;
  }
  if(!window.isSecureContext){
    toast('Bluetooth needs HTTPS or localhost (not file://)');
    return;
  }
  if(!navigator.bluetooth){
    toast('Web Bluetooth missing — use Chrome/Edge');
    return;
  }
  btBusy=true;
  setBtUi(false,null,'…');
  try{
    setBtUi(false,null,'Loading…');
    const ganConnect=await loadGanConnect();
    if(ganConnect){
      try{
        setBtUi(false,null,'Pair…');
        toast('Pick your cube in the browser popup…');
        const conn=await withTimeout(ganConnect(ganMacProvider),45000,'Connection timed out');
        await finishGanConnect(conn);
        return;
      }catch(err){
        console.warn('GAN connect error',err);
        if(err&&err.name==='NotFoundError'){toast('No device selected');return}
        toast('Connect failed: '+errMsg(err));
      }
    }else{
      toast('Could not load Bluetooth library (check network)');
    }
    if(!btConn)setBtUi(false);
  }finally{
    btBusy=false;
    if(!btConn)setBtUi(false);
  }
}

/* —— 3D scramble animation (lightweight) —— */
const A3_COLORS={U:'#f5f5f5',R:'#c41e3a',F:'#009b48',D:'#ffd500',L:'#ff5800',B:'#0051ba'};
let animTimer=0,animState=null;
function animSolved(){
  const o={};for(const f of'URFDLB')o[f]=Array(9).fill(f);return o;
}
function animRot(face,cw){
  const a=face.slice(),map=cw?[6,3,0,7,4,1,8,5,2]:[2,5,8,1,4,7,0,3,6];
  return map.map(i=>a[i]);
}
function animMove(st,mv){
  const m=mv.replace(/[()]/g,'').trim();if(!m)return st;
  const face=m[0],mod=m.slice(1);
  if(!'URFDLB'.includes(face))return st;
  const times=mod==='2'?2:mod==="'"?3:1;
  const s={};for(const f of'URFDLB')s[f]=st[f].slice();
  const cycleU=()=>{s.U=animRot(s.U,true);const t=s.F.slice(0,3);s.F[0]=s.L[0];s.F[1]=s.L[1];s.F[2]=s.L[2];s.L[0]=s.B[0];s.L[1]=s.B[1];s.L[2]=s.B[2];s.B[0]=s.R[0];s.B[1]=s.R[1];s.B[2]=s.R[2];s.R[0]=t[0];s.R[1]=t[1];s.R[2]=t[2]};
  // Use full apply via temporary - simplified: only show face twists visually on that face
  for(let i=0;i<times;i++){
    if(face==='U'){s.U=animRot(s.U,true)}
    else if(face==='D'){s.D=animRot(s.D,true)}
    else if(face==='R'){s.R=animRot(s.R,true)}
    else if(face==='L'){s.L=animRot(s.L,true)}
    else if(face==='F'){s.F=animRot(s.F,true)}
    else if(face==='B'){s.B=animRot(s.B,true)}
  }
  return s;
}
function renderAnimCube(st){
  const box=$('#anim3d');if(!box)return;
  box.innerHTML='<div class="acube"></div>';
  const cube=box.querySelector('.acube');
  for(const f of'URFDLB'){
    const face=document.createElement('div');face.className='af '+f;
    for(let i=0;i<9;i++){
      const cell=document.createElement('i');
      cell.style.background=A3_COLORS[st[f][i]]||'#333';
      face.appendChild(cell);
    }
    cube.appendChild(face);
  }
}
function playScrambleAnim(text){
  const box=$('#anim3d');if(!box)return;
  if(!S.set.animScr||!text){box.hidden=true;return}
  box.hidden=false;
  if(animTimer){clearInterval(animTimer);animTimer=0}
  const toks=(text||'').replace(/[()]/g,' ').trim().split(/\s+/).filter(Boolean);
  animState=animSolved();
  renderAnimCube(animState);
  let i=0;
  animTimer=setInterval(()=>{
    if(i>=toks.length){clearInterval(animTimer);animTimer=0;return}
    animState=animMove(animState,toks[i++]);
    renderAnimCube(animState);
  },120);
}

  const b=e.target.closest('[data-q]');if(!b)return;
  const s=ss(),x=s.solves[s.solves.length-1],q=b.dataset.q;
  if(!x&&q!=='ok')return;
  if(q==='ok'){toast('OK');return}
  if(q==='p2')x.pen=x.pen===2000?0:2000;
  else if(q==='dnf')x.pen=x.pen<0?0:-1;
  else if(q==='del')s.solves.pop();
  else if(q==='undo'){undoLast();return}
  else if(q==='note'){openNote(s.solves.length-1);return}
  save();render();
});
$('#sess').onchange=e=>{S.cur=+e.target.value;save();scrs=[];newScr();render();e.target.blur()};
$('#ev').onchange=e=>{ss().event=e.target.value;save();scrs=[];newScr();render();e.target.blur()};
$('#mode').onchange=e=>{setMode(e.target.value);e.target.blur()};
document.getElementById('methodRow').addEventListener('click',e=>{
  const b=e.target.closest('[data-method]');
  if(b)setMethod(b.dataset.method);
});
document.getElementById('stageRow').addEventListener('click',e=>{
  const b=e.target.closest('[data-mode]');
  if(b)setMode(b.dataset.mode);
});
$('#prev').onclick=()=>{if(si>0){si--;showScr()}};
$('#next').onclick=()=>{si<scrs.length-1?(si++,showScr()):newScr()};
$('#copyScr').onclick=()=>copyScramble();
$('#newS').onclick=openNew;
$('#data').onclick=openData;
$('#help').onclick=openHelp;
$('#bt').onclick=toggleBt;
$('#theme').onclick=()=>{
  // Quick cycle: Auto → Light → Dark → Auto (full themes still in Options)
  const quick=['auto','light','dark'];
  const cur=S.set.theme||'auto';
  const i=quick.indexOf(cur);
  S.set.theme=i<0?'auto':quick[(i+1)%quick.length];
  save();render();
};
$('#themeSel').onchange=e=>{S.set.theme=e.target.value;save();render();e.target.blur()};
$('#fontSel').onchange=e=>{S.set.font=e.target.value;save();render();e.target.blur()};
$('#sizeSel').onchange=e=>{S.set.size=e.target.value;save();render();e.target.blur()};
// Follow OS dark mode changes while theme is Auto
try{
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const onScheme=()=>{if((S.set.theme||'auto')==='auto')applyAppearance()};
  if(mq.addEventListener)mq.addEventListener('change',onScheme);
  else if(mq.addListener)mq.addListener(onScheme);
}catch(_){}
for(const[k,id]of[['hide','hide'],['ms','ms'],['snd','snd'],['voice','voice'],['stopSnd','stopSnd'],['phaseBeep','phaseBeep'],['autoScr','autoScr'],['confirm','confirm'],['spark','spark'],['perSess','perSess'],['dualCtrl','dualCtrl'],['animScr','animScr'],['autoBackup','autoBackup'],['man','mn'],['img','img'],['scrHelp','scrHelp']])
  if($('#'+id))$('#'+id).onchange=e=>{S.set[k]=e.target.checked;save();render();e.target.blur();if(k==='man'&&e.target.checked)$('#man').focus();if(k==='scrHelp'||k==='img'||k==='animScr')showScr()};
if($('#theater'))$('#theater').onchange=e=>{toggleTheater(!!e.target.checked);e.target.blur()};
if($('#theaterExit'))$('#theaterExit').onclick=()=>toggleTheater(false);
if($('#backup'))$('#backup').onclick=()=>downloadBackup('manual');
if($('#profileName')){
  const saveProf=()=>{S.set.profileName=($('#profileName').value||'').trim();save()};
  $('#profileName').onchange=saveProf;$('#profileName').onblur=saveProf;
}
// Custom colors + background image
const wireColor=(id,key)=>{
  const el=$(id);if(!el)return;
  el.addEventListener('input',()=>{S.set[key]=el.value;save();applyAppearance()});
};
wireColor('#colBg','colBg');wireColor('#colPan','colPan');wireColor('#colInk','colInk');wireColor('#colBlu','colBlu');
if($('#bgImg')){
  const applyBg=()=>{S.set.bgImg=($('#bgImg').value||'').trim();save();applyAppearance()};
  $('#bgImg').onchange=applyBg;$('#bgImg').onblur=applyBg;
}
if($('#colReset'))$('#colReset').onclick=()=>{
  S.set.colBg=S.set.colPan=S.set.colInk=S.set.colBlu='';
  S.set.bgImg='';
  save();render();toast('Colors reset');
};
if($('#timeU'))$('#timeU').onchange=e=>{S.set.timeU=e.target.value||'full';save();e.target.blur()};
if($('#stopKey'))$('#stopKey').onchange=e=>{S.set.stopKey=e.target.value||'any';save();e.target.blur()};
if($('#inspMode'))$('#inspMode').onchange=e=>{setOpt('inspMode',e.target.value||'off');render();e.target.blur()};
if($('#renS'))$('#renS').onclick=()=>{
  const s=ss();
  const name=prompt('Session name',s.name);
  if(name!==null&&name.trim()){s.name=name.trim();save();render();toast('Renamed')}
};
// Scramble helper controls
if($('#stepNext'))$('#stepNext').onclick=()=>setScrStep(scrStep+1);
if($('#stepPrev'))$('#stepPrev').onclick=()=>setScrStep(scrStep-1);
if($('#stepReset'))$('#stepReset').onclick=()=>{stopScrPlay();setScrStep(0)};
if($('#stepPlay'))$('#stepPlay').onclick=()=>{
  if(scrPlayTimer){stopScrPlay();return}
  if(scrStep>=scrTokens.length)setScrStep(0);
  $('#stepPlay').textContent='Pause';
  scrPlayTimer=setInterval(()=>{
    if(scrStep>=scrTokens.length){stopScrPlay();return}
    setScrStep(scrStep+1);
  },650);
};
if($('#holdSel'))$('#holdSel').onchange=e=>{S.set.hold=+e.target.value||300;save();e.target.blur()};
if($('#phaseSel'))$('#phaseSel').onchange=e=>{setOpt('phases',+e.target.value||1);render();e.target.blur()};
if($('#targetIn')){
  const applyTarget=()=>{
    const v=parseFloat($('#targetIn').value);
    setOpt('target',(isFinite(v)&&v>0)?v:0);
  };
  $('#targetIn').onchange=applyTarget;
  $('#targetIn').onblur=applyTarget;
}
if($('#statRows'))$('#statRows').onchange=e=>{
  const opts=[...e.target.selectedOptions].map(o=>o.value);
  S.set.statRows=opts.length?opts:['single','ao5','ao12','n'];
  save();render();
};
$('#logo').innerHTML=['red','blu','yel','grn','org','mute','blu','red','grn'].map(c=>`<i style="background:var(--${c})"></i>`).join('');
try{const v=document.querySelector('.brand');if(v&&!v.querySelector('.ver')){const s=document.createElement('span');s.className='ver';s.textContent=CUBETIMER_VER;s.style.cssText='font-size:10px;color:var(--mute);margin-left:6px;font-weight:500';v.appendChild(s)}}catch(_){}
newScr();render();
</script>

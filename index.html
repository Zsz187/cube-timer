<body>
<header>
  <div class="brand"><span class="logo" id="logo"></span>Cubing timer</div>
  <div class="bar">
    <select id="sess" aria-label="Session"></select>
    <button id="newS">New session</button>
    <button id="data">Import / export</button>
    <button id="bt" title="Connect smart cube (Chrome/Edge, HTTPS required)">BT</button>
    <button id="help">Help</button>
    <button id="theme">Theme: auto</button>
  </div>
</header>
<main>
  <section id="stage">
    <div class="cfop-row" id="methodRow">
      <span class="cfop-label">Method</span>
      <button type="button" class="cfop-btn" data-method="timer">Timer</button>
      <button type="button" class="cfop-btn" data-method="cfop">CFOP</button>
      <button type="button" class="cfop-btn" data-method="begcfop">Beginner CFOP</button>
      <button type="button" class="cfop-btn" data-method="roux">Roux</button>
      <button type="button" class="cfop-btn" data-method="zz">ZZ</button>
      <button type="button" class="cfop-btn" data-method="petrus">Petrus</button>
      <button type="button" class="cfop-btn" data-method="beginner">Beginner</button>
    </div>
    <div class="cfop-row" id="stageRow"></div>
    <div class="top">
      <select id="mode" aria-label="Mode" hidden></select>
      <select id="ev" aria-label="Event"></select>
      <button id="prev" aria-label="Previous scramble">‹</button>
      <div id="scr"></div>
      <button id="next" aria-label="Next scramble">›</button>
    </div>
    <div id="casebar"></div>
    <div id="simg" aria-hidden="true"></div>
    <div id="pad" data-s="idle" tabindex="0" aria-label="Timer pad">
      <div id="time">0.00</div>
      <div id="sub"></div>
      <input id="man" type="text" inputmode="decimal" placeholder="Type a time, press Enter" autocomplete="off">
    </div>
    <div id="quick"></div>
    <div class="chips">
      <label><input type="checkbox" id="insp">Inspection (15 s)</label>
      <label><input type="checkbox" id="hide">Hide time while solving</label>
      <label><input type="checkbox" id="ms">Milliseconds</label>
      <label><input type="checkbox" id="snd">Inspection sounds</label>
      <label><input type="checkbox" id="mn">Type times in</label>
      <label><input type="checkbox" id="img">Scramble image</label>
      <label>Theme <select id="themeSel" aria-label="Color theme"></select></label>
      <label>Font <select id="fontSel" aria-label="Font pair"></select></label>
      <label>Size <select id="sizeSel" aria-label="UI size"></select></label>
    </div>
  </section>
  <aside>
    <div class="card st" id="stats"></div>
    <div class="card"><canvas id="cv"></canvas></div>
    <div class="card" id="list"></div>
  </aside>
</main>
<dialog id="dg"></dialog>
<div id="toast" role="status"></div>
<script>
const CUBETIMER_VER='2026-11-12-web';
console.info('[Cubing Timer]',CUBETIMER_VER,'(web PWA · multi-method)');
const $=q=>document.querySelector(q),KEY='cubetimer.v1';
function sc(groups,mods,len){
  const o=[];let la=-1;
  while(o.length<len){
    let a;do a=Math.random()*groups.length|0;while(a===la);
    la=a;const g=groups[a];
    o.push(g[Math.random()*g.length|0]+mods[Math.random()*mods.length|0]);
  }
  return o.join(' ');
}
const M3=['','\'','2'],M2=['','\''];
function scSq1(){
  const moves=[];
  for(let i=0;i<16;i++){
    const u=Math.floor(Math.random()*12)-5,d=Math.floor(Math.random()*12)-5;
    moves.push(`(${u},${d})`);
    if(i<15)moves.push('/');
  }
  return moves.join(' ');
}
function scClock(){
  const pins=['UR','DR','DL','UL'],face=['U','R','D','L','ALL'];
  let s='';
  face.forEach(f=>{const n=Math.floor(Math.random()*12)-5;if(n)s+=`${f}${n>0?'+'+n:n} `});
  pins.forEach(p=>{if(Math.random()<.5)s+=p+' '});
  s+='y2 ';
  face.forEach(f=>{const n=Math.floor(Math.random()*12)-5;if(n)s+=`${f}${n>0?'+'+n:n} `});
  pins.forEach(p=>{if(Math.random()<.5)s+=p+' '});
  return s.trim();
}
function scMinx(){
  const faces=['U','R','F','L','BL','BR'],mods=['','\''];
  const o=[];let last=-1;
  for(let i=0;i<70;i++){
    let a;do a=Math.random()*faces.length|0;while(a===last);
    last=a;
    o.push(faces[a]+mods[Math.random()*2|0]+(Math.random()<.5?'2':''));
  }
  return o.join(' ');
}
/* ========== Local scramble generators (offline, no CDN) ========== */
/*
 * 222: exact random-state (uniform over reachable positions)
 * 333/OH/BLD: near-uniform HTM mixer (25 moves, WCA face-axis rules)
 *   — true optimal random-state needs large pruning tables/workers;
 *     this is the standard offline practice approach and mixes the cube well.
 * Others: event-specific random-move generators
 */
const RS222=(function(){
  function id(){return{cp:[0,1,2,3,4,5,6,7],co:[0,0,0,0,0,0,0,0]}}
  function cpy(c){return{cp:c.cp.slice(),co:c.co.slice()}}
  const CCP=[[3,0,1,2,4,5,6,7],[4,1,2,0,7,5,6,3],[1,5,2,3,0,4,6,7]];
  const CCO=[[0,0,0,0,0,0,0,0],[2,0,0,1,1,0,0,2],[1,2,0,0,2,1,0,0]];
  function mov(c,f){const o=cpy(c),cp=CCP[f],co=CCO[f];for(let i=0;i<8;i++){o.cp[i]=c.cp[cp[i]];o.co[i]=(c.co[cp[i]]+co[i])%3}return o}
  function movN(c,f,n){let x=c;for(let i=0;i<n;i++)x=mov(x,f);return x}
  function parity(a){let p=0;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i]>a[j])p^=1;return p}
  function solved(c){for(let i=0;i<8;i++)if(c.cp[i]!==i||c.co[i])return false;return true}
  function key(c){return c.cp.join('')+c.co.join('')}
  function randomState(){
    // 2x2 with fixed orientation: any CP is reachable; only CO sum ≡ 0 (mod 3)
    const c=id();
    for(let i=7;i>0;i--){const j=Math.random()*(i+1)|0;[c.cp[i],c.cp[j]]=[c.cp[j],c.cp[i]]}
    let s=0;for(let i=0;i<7;i++){c.co[i]=Math.random()*3|0;s+=c.co[i]}c.co[7]=(3-s%3)%3;
    return c;
  }
  const MN=['U','U2',"U'",'R','R2',"R'",'F','F2',"F'"];
  function invM(m){return(m/3|0)*3+(2-(m%3))}
  function expand(start, depth){
    const map=new Map(); // key -> move list from start
    map.set(key(start), []);
    let frontier=[{c:start,path:[]}];
    for(let d=0;d<depth;d++){
      const next=[];
      for(const {c,path} of frontier){
        const last=path.length?path[path.length-1]:-1;
        const lf=last<0?-1:(last/3|0);
        for(let f=0;f<3;f++){
          if(f===lf)continue;
          for(let p=1;p<=3;p++){
            const nc=movN(c,f,p), nk=key(nc);
            if(map.has(nk))continue;
            const np=path.concat(f*3+(p-1));
            map.set(nk,np);
            next.push({c:nc,path:np});
          }
        }
      }
      frontier=next;
    }
    return map;
  }
  function scramble(){
    const st=randomState();
    if(solved(st))return sc([['R'],['U'],['F']],M3,9);
    const fwd=expand(st,6);
    const bwd=expand(id(),6);
    let best=null;
    for(const [k,fp] of fwd){
      if(!bwd.has(k))continue;
      const bp=bwd.get(k);
      const sol=fp.concat(bp.slice().reverse().map(invM));
      if(!best||sol.length<best.length)best=sol;
    }
    if(best&&best.length){
      // scramble = inv(solution)
      return best.slice().reverse().map(m=>MN[invM(m)]).join(' ');
    }
    // Fallback mixer
    return sc([['R'],['U'],['F']],M3,11);
  }
  return{scramble};
})();

/* 3x3 near-uniform random-move (HTM, no consecutive same face, axis order) */
function scramble333RS(){
  const faces=['U','D','R','L','F','B'];
  const axisOf=[0,0,1,1,2,2]; // U D / R L / F B
  const mods=['','2',"'"];
  const out=[];
  let prevFace=-1, prevAxis=-1;
  const len=25;
  for(let i=0;i<len;i++){
    let f;
    do{
      f=Math.random()*6|0;
    }while(f===prevFace || (axisOf[f]===prevAxis && f<prevFace));
    // also avoid three consecutive same axis turns stacking: if last axis same and would force opposite face only
    prevAxis=axisOf[f];
    prevFace=f;
    out.push(faces[f]+mods[Math.random()*3|0]);
  }
  return out.join(' ');
}

function invAlg(alg){
  const toks=alg.replace(/[()]/g,' ').trim().split(/\s+/).filter(Boolean);
  const inv=[];
  for(let i=toks.length-1;i>=0;i--){
    const t=toks[i];
    if(t.endsWith('2'))inv.push(t);
    else if(t.endsWith("'"))inv.push(t.slice(0,-1));
    else inv.push(t+"'");
  }
  return inv.join(' ');
}

  const t=Math.ceil(n*.05);
  if(d>t)return Infinity;
  return mean([...w].sort((a,b)=>a-b).slice(t,n-t));

const ADJ={
  // face -> [U-edge order of sides when looking at face]: cycles of side faces for CW
  U:[['F',0],['R',0],['B',0],['L',0]], // top rows
  D:[['F',2],['L',2],['B',2],['R',2]],
  R:[['U',1],['F',1],['D',1],['B',3]],
  L:[['U',3],['B',1],['D',3],['F',3]],
  F:[['U',2],['R',3],['D',0],['L',1]],
  B:[['U',0],['L',3],['D',2],['R',1]]
};
function getStrip(face,side,n){
  // side 0=top row, 1=right col, 2=bottom row, 3=left col
  const s=[];
  if(side===0){for(let c=0;c<n;c++)s.push(face[c])}
  else if(side===1){for(let r=0;r<n;r++)s.push(face[r*n+(n-1)])}
  else if(side===2){for(let c=n-1;c>=0;c--)s.push(face[(n-1)*n+c])}
  else {for(let r=n-1;r>=0;r--)s.push(face[r*n])}
  return s;
}
function setStrip(face,side,n,vals){
  let i=0;
  if(side===0){for(let c=0;c<n;c++)face[c]=vals[i++]}
  else if(side===1){for(let r=0;r<n;r++)face[r*n+(n-1)]=vals[i++]}
  else if(side===2){for(let c=n-1;c>=0;c--)face[(n-1)*n+c]=vals[i++]}
  else {for(let r=n-1;r>=0;r--)face[r*n]=vals[i++]}
}
function applyMove(state,n,face,pow){
  // pow: 1=CW, 2=180, 3=CCW
  for(let t=0;t<pow;t++){
    state[face]=faceRot(state[face],n,true);
    const cyc=ADJ[face];
    const strips=cyc.map(([f,s])=>getStrip(state[f],s,n));
    for(let i=0;i<4;i++){
      const [f,s]=cyc[i];
      setStrip(state[f],s,n,strips[(i+3)%4]);
    }
  }
}
function parseMoves(scr){
  // basic SiGN-like tokens: R, R', R2, Rw, 3Rw', etc. Outer-layer focus for display
  const toks=scr.replace(/[()]/g,' ').trim().split(/\s+/).filter(Boolean);
  const out=[];
  for(const t of toks){
    const m=t.match(/^(\d*)([URFDLB])(w?)([2']?)$/i);
    if(!m)continue;
    const face=m[2].toUpperCase();
    const wide=!!m[3];
    // ignore wide/inner for simple net (still rotate outer face for visual)
    let pow=1;
    if(m[4]==="2")pow=2;
    else if(m[4]==="'")pow=3;
    out.push([face,pow]);
  }
  return out;
}
function scrambleState(n,scr){
  const st=solvedFacelets(n);
  for(const [face,pow] of parseMoves(scr)){
    if(st[face])applyMove(st,n,face,pow);
  }
  return st;
}
function eventSize(ev){
  if(ev==='222')return 2;
  if(ev==='444')return 4;
  if(ev==='555')return 5;
  if(ev==='666')return 6;
  if(ev==='777')return 7;
  return 3; // 333 / oh / bld / others approximate
}
function drawNet(canvas,state,n){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const gap=1;
  const cell=Math.floor(Math.min((W-4)/(4*n),(H-4)/(3*n)));
  if(cell<2)return;
  const netW=4*n*cell, netH=3*n*cell;
  const ox=Math.floor((W-netW)/2), oy=Math.floor((H-netH)/2);
  // layout:  . U .
  //        L F R B
  //          D
  const pos={
    U:[n,0], R:[2*n,n], F:[n,n], D:[n,2*n], L:[0,n], B:[3*n,n]
  };
  for(const f of 'URFDLB'){
    const [px,py]=pos[f];
    const stickers=state[f];
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      const col=FACE_COLORS[stickers[r*n+c]]||'#888';
      const x=ox+(px+c)*cell, y=oy+(py+r)*cell;
      ctx.fillStyle=col;
      ctx.fillRect(x+gap,y+gap,cell-gap*2,cell-gap*2);
      ctx.strokeStyle='rgba(0,0,0,.25)';
      ctx.lineWidth=1;
      ctx.strokeRect(x+gap,y+gap,cell-gap*2,cell-gap*2);
    }
  }
}
function updateScrambleImage(scramble){
  const box=$('#simg');
  if(!box)return;
  if(!S.set.img||!scramble){
    box.innerHTML='';
    box.hidden=true;
    return;
  }
  box.hidden=false;
  const ev=EV_MAP[ss().event]||'333';
  // Only draw cube nets for cube-like events (not clock/sq1/pyra/minx reliably)
  if(['clock','sq1','pyram','minx','skewb'].includes(ev)){
    box.innerHTML='<div class="img-fallback" style="font-size:11px;color:var(--mute);padding:6px;text-align:center">Net preview N/A for this event</div>';
    return;
  }
  let canvas=box.querySelector('canvas.scrnet');
  if(!canvas){
    box.innerHTML='';
    canvas=document.createElement('canvas');
    canvas.className='scrnet';
    canvas.width=280; canvas.height=210;
    canvas.style.width='min(260px,85vw)';
    canvas.style.height='auto';
    canvas.style.display='block';
    canvas.style.margin='0 auto';
    box.appendChild(canvas);
  }
  const n=eventSize(ev);
  try{
    const st=scrambleState(n,scramble);
    drawNet(canvas,st,n);
  }catch(err){
    console.warn('net draw failed',err);
    box.innerHTML='<div class="img-fallback" style="font-size:11px;color:var(--mute);padding:6px;text-align:center">Could not draw scramble</div>';
  }
}


/* timer */
const pad=$('#pad'),T=$('#time'),SUB=$('#sub');
let st='idle',holding=false,armed=false,ht,t0=0,i0=0,raf=0,pen=0,b8=0,b12=0,ac;
function beep(f,d){
  if(!S.set.snd)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;g.gain.value=.08;
    o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
function setS(s,sub){pad.dataset.s=s;if(sub!==undefined)SUB.textContent=sub}
const hint=()=>S.set.man?'Type your time below':S.set.insp?'Press and release to start inspection':'Hold space or the pad until it turns green, then release';
function tick(){
  if(st==='run'){T.textContent=S.set.hide?'…':fmt(performance.now()-t0)}
  else if(st==='insp'){
    const el=(performance.now()-i0)/1000;
    if(el>=8&&!b8){b8=1;beep(660,.15)}
    if(el>=12&&!b12){b12=1;beep(880,.3)}
    if(!holding||!armed)T.textContent=el<15?Math.ceil(15-el):el<17?'+2':'DNF';
  }else return;
  raf=requestAnimationFrame(tick);
}
function down(){
  if(st==='run'){stop();return}
  if(S.set.man||(st!=='idle'&&st!=='insp'))return;
  holding=true;armed=false;
  if(st==='idle'&&S.set.insp)return setS('hold');
  setS('hold');
  clearTimeout(ht);
  ht=setTimeout(()=>{if(holding){armed=true;setS('ready')}},300);
}
function up(){
  if(!holding)return;
  holding=false;clearTimeout(ht);
  if(st==='idle'&&S.set.insp){
    st='insp';i0=performance.now();b8=b12=0;
    setS('insp','Hold, then release to start solving');
    document.body.classList.add('running');
    tick();
  }else if(armed)start();
  else setS(st==='insp'?'insp':'idle');
}
function start(){
  cancelAnimationFrame(raf);pen=0;
  if(st==='insp'){
    const el=(performance.now()-i0)/1000;
    pen=el>17?-1:el>15?2000:0;
  }
  st='run';t0=performance.now();
  document.body.classList.add('running');
  setS('run','');
  tick();
}
function stop(){
  cancelAnimationFrame(raf);
  const t=Math.floor(performance.now()-t0);
  st='idle';
  document.body.classList.remove('running');
  setS('idle',hint());
  add(t,pen,scrs[si]);
}
function add(t,p,scr){
  const s=ss(),v=s.solves.map(E),pb=bestAo(v,1),pa=bestAo(v,5);
  s.solves.push({t,pen:p,scr,ts:Date.now(),note:''});
  const v2=s.solves.map(E),n=v2.length-1;
  let msg='';
  if(p>=0&&v.length&&v2[n]<pb)msg='New best single';
  const a5=ao(v2,5);
  if(a5!==null&&pa!==null&&a5<pa&&isFinite(a5))msg=msg?'New best single and ao5':'New best ao5';
  save();newScr();render();
  if(msg)toast(msg);
}
function toast(m){
  const e=$('#toast');
  e.textContent=m;e.classList.add('show');
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>e.classList.remove('show'),2600);
}

/* input */
const typing=e=>/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||$('#dg').open;
addEventListener('keydown',e=>{
  if(typing(e)){if(e.target.id==='man'&&e.key==='Enter')manual();return}
  if(e.key==='Escape'){
    if(st==='insp'){st='idle';cancelAnimationFrame(raf);holding=false;setS('idle',hint());render()}
    else if($('#dg').open)$('#dg').close();
    return;
  }
  if(st==='run'&&!['Shift','Control','Alt','Meta'].includes(e.key)){e.preventDefault();stop();return}
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)down()}
  if(e.key==='?'||(e.shiftKey&&e.key==='/')){e.preventDefault();openHelp()}
});
addEventListener('keyup',e=>{if(e.code==='Space'&&!typing(e)){e.preventDefault();up()}});
addEventListener('pointerdown',e=>{
  if(st==='run'){e.preventDefault();stop()}
  else if(pad.contains(e.target)&&e.target.id!=='man')down();
});
addEventListener('pointerup',up);
addEventListener('pointercancel',up);
function parseT(x){
  x=x.trim().toLowerCase();
  if(x==='dnf')return -1;
  const m=x.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  return m?Math.round(((+m[1]||0)*60+ +m[2])*1000):null;
}
function manual(){
  const i=$('#man'),v=parseT(i.value);
  if(v===null)return toast('Enter a time like 12.34 or 1:02.5');
  i.value='';
  v<0?add(0,-1,scrs[si]):add(v,0,scrs[si]);
}

  ['forest','Forest'],['sunset','Sunset'],['ocean','Ocean'],['mono','Mono'],
  ['terminal','Terminal'],['rose','Rose'],['slate','Slate']

const FONTS=[
  ['default',"Default", "'Bricolage Grotesque',system-ui,sans-serif", "'Chivo Mono',ui-monospace,monospace"],
  ['inter',"Inter + JetBrains", "'Inter',system-ui,sans-serif", "'JetBrains Mono',ui-monospace,monospace"],
  ['space',"Space Grotesk + IBM", "'Space Grotesk',system-ui,sans-serif", "'IBM Plex Mono',ui-monospace,monospace"],
  ['outfit',"Outfit + Roboto Mono", "'Outfit',system-ui,sans-serif", "'Roboto Mono',ui-monospace,monospace"],
  ['plex',"IBM Plex", "'IBM Plex Sans',system-ui,sans-serif", "'IBM Plex Mono',ui-monospace,monospace"],
  ['system',"System", "system-ui,-apple-system,sans-serif", "ui-monospace,SFMono-Regular,Menlo,monospace"]
];
const SIZES=[['compact','Compact'],['normal','Normal'],['large','Large'],['huge','Huge']];
function applyAppearance(){
  const root=document.documentElement;
  const th=S.set.theme||'auto';
  if(th==='auto')root.removeAttribute('data-theme');
  else root.dataset.theme=th;
  const sz=S.set.size||'normal';
  root.dataset.size=sz;
  const f=FONTS.find(x=>x[0]===(S.set.font||'default'))||FONTS[0];
  root.style.setProperty('--font-ui',f[2]);
  root.style.setProperty('--font-mono',f[3]);
  const ts=$('#themeSel'),fs=$('#fontSel'),ss=$('#sizeSel');
  if(ts){ts.innerHTML=THEMES.map(([k,l])=>`<option value="${k}"${k===th?' selected':''}>${l}</option>`).join('')}
  if(fs){fs.innerHTML=FONTS.map(([k,l])=>`<option value="${k}"${k===(S.set.font||'default')?' selected':''}>${l}</option>`).join('')}
  if(ss){ss.innerHTML=SIZES.map(([k,l])=>`<option value="${k}"${k===sz?' selected':''}>${l}</option>`).join('')}
  const tb=$('#theme');
  if(tb)tb.textContent='Theme: '+(THEMES.find(x=>x[0]===th)||['','?'])[1];
}

/* render */
function render(){
  const s=ss(),v=s.solves.map(E);
  $('#sess').innerHTML=S.sessions.map(x=>`<option value="${x.id}"${x.id===s.id?' selected':''}>${esc(x.name)} (${x.solves.length})</option>`).join('');
  $('#ev').innerHTML=Object.entries(EV).map(([k,e])=>`<option value="${k}"${k===s.event?' selected':''}>${e[0]}</option>`).join('');
  const mode=S.set.mode||'timer';
  const ms=$('#mode');
  if(ms)ms.innerHTML=MODES.map(([k,l])=>`<option value="${k}"${k===mode?' selected':''}>${l}</option>`).join('');
  document.body.classList.toggle('cfop',(S.set.method||'timer')!=='timer');
  for(const k of['insp','hide','ms','snd'])$('#'+k).checked=S.set[k];
  $('#mn').checked=S.set.man;
  $('#img').checked=S.set.img;
  document.body.classList.toggle('manual',S.set.man);
  applyAppearance();
  const f=x=>x===null?'–':fmt(x),ok=v.filter(isFinite);
  const row=(n,c,b)=>`<span>${n}</span><b>${f(c)}</b><b>${f(b)}</b>`;
  $('#stats').innerHTML=`<span></span><span class="h">current</span><span class="h">best</span>`+
    row('Single',v.length?v[v.length-1]:null,bestAo(v,1))+
    row('Mean of 3',ao(v,3),bestAo(v,3))+
    row('Average of 5',ao(v,5),bestAo(v,5))+
    row('Average of 12',ao(v,12),bestAo(v,12))+
    row('Average of 50',ao(v,50),bestAo(v,50))+
    row('Average of 100',ao(v,100),bestAo(v,100))+
    `<span>Session mean</span><b>${ok.length?f(mean(ok)):'–'}</b><b></b>`+
    `<span>Solves</span><b>${v.length}</b><b></b>`;
  const L=$('#list');
  if(!v.length)L.innerHTML='<div class="empty">No solves yet. Hold space and release to start.</div>';
  else{
    const pb=bestAo(v,1);
    let h='';
    for(let i=v.length-1;i>=Math.max(0,v.length-300);i--){
      const w=v.slice(0,i+1),a5=ao(w,5),a12=ao(w,12);
      const isPb=isFinite(v[i])&&v[i]===pb;
      h+=`<button class="row${isPb?' pb':''}" data-i="${i}"><span>${i+1}</span><b>${fs(s.solves[i])}</b><span>${a5===null?'':fmt(a5)}</span><span>${a12===null?'':fmt(a12)}</span></button>`;
    }
    L.innerHTML='<div class="row" style="padding-bottom:2px"><span>#</span><span>time</span><span>ao5</span><span>ao12</span></div>'+h;
  }
  const last=s.solves[s.solves.length-1];
  $('#quick').innerHTML=last
    ?`Last solve ${fs(last)}${last.note?' · '+esc(last.note):''} <button data-q="p2">+2</button><button data-q="dnf">DNF</button><button data-q="del">Delete</button><button data-q="note">Note</button>`
    :'';
  if(st==='idle'){T.textContent=last?fs(last):fmt(0);SUB.textContent=hint()}
  // Keep scramble image in sync with current settings
  showScr();
  draw();
}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){
  const c=$('#cv'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;
  if(!r.width)return;
  c.width=r.width*d;c.height=r.height*d;
  const g=c.getContext('2d');g.scale(d,d);
  const W=r.width,H=r.height,v=ss().solves.map(E),fin=v.filter(isFinite),css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  g.font='13px system-ui,sans-serif';
  if(v.length<2||!fin.length){
    g.fillStyle=col('--mute');g.textAlign='center';
    g.fillText('Your graph appears after two solves',W/2,H/2);
    return;
  }
  const lo=Math.min(...fin),hi=Math.max(...fin);
  const X=i=>12+i*(W-24)/(v.length-1),Y=x=>H-16-(x-lo)/((hi-lo)||1)*(H-40);
  g.fillStyle=col('--mute');
  v.forEach((x,i)=>{if(isFinite(x)){g.beginPath();g.arc(X(i),Y(x),2.5,0,7);g.fill()}});
  [[5,'--blu'],[12,'--org']].forEach(([n,cl])=>{
    g.strokeStyle=col(cl);g.lineWidth=2;g.beginPath();let on=0;
    for(let i=n;i<=v.length;i++){
      const a=aoW(v.slice(i-n,i),n);
      if(!isFinite(a)){on=0;continue}
      on?g.lineTo(X(i-1),Y(a)):g.moveTo(X(i-1),Y(a));on=1;
    }
    g.stroke();
  });
  g.textAlign='left';g.fillStyle=col('--blu');g.fillText('ao5',12,12);
  g.fillStyle=col('--org');g.fillText('ao12',42,12);
  g.fillStyle=col('--mute');g.textAlign='right';
  g.fillText(fmt(hi)+' / '+fmt(lo),W-12,12);
}
addEventListener('resize',draw);

dg.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(e.target===dg){dg.close();return}
  if(!b)return;
  const a=b.dataset.a,s=ss(),i=+dg.dataset.i,x=s.solves[i];
  if(a==='close')dg.close();
  else if(a==='p2'){x.pen=x.pen===2000?0:2000;save();render();openSolve(i)}
  else if(a==='dnf'){x.pen=x.pen<0?0:-1;save();render();openSolve(i)}
  else if(a==='del'){s.solves.splice(i,1);save();render();dg.close()}
  else if(a==='copy')copy(x.scr||'');
  else if(a==='note')openNote(i);
  else if(a==='saven'){x.note=($('#nt')?.value||'').trim();save();render();dg.close();toast('Note saved')}
  else if(a==='exp')copy($('#tx').value);
  else if(a==='plain'){
    const plain=s.solves.map((x,i)=>`${i+1}. ${fs(x)}${x.note?' // '+x.note:''}`).join('\n');
    copy(plain);
  }
  else if(a==='imp'){
    const t=$('#tx').value.trim();let add=[];
    try{
      let j=JSON.parse(t);
      j=Array.isArray(j)?j:j.solves||[];
      add=j.map(y=>typeof y==='number'
        ?{t:Math.round(y*1000),pen:0,scr:'',ts:Date.now(),note:''}
        :{t:+y.t||0,pen:+y.pen||0,scr:y.scr||'',ts:y.ts||Date.now(),note:y.note||''});
    }catch(er){
      add=t.split(/[\s,;]+/).map(parseT).filter(v=>v!==null)
        .map(v=>v<0?{t:0,pen:-1,scr:'',ts:Date.now(),note:''}:{t:v,pen:0,scr:'',ts:Date.now(),note:''});
    }
    if(!add.length)return toast('Nothing to import');
    s.solves.push(...add);save();render();dg.close();toast('Imported '+add.length+' solves');
  }
  else if(a==='ren'){
    const name=prompt('Session name',s.name);
    if(name!==null&&name.trim()){s.name=name.trim();save();render();toast('Renamed')}
  }
  else if(a==='clr'){if(sure(b)){s.solves=[];save();render();dg.close()}}
  else if(a==='dels'){
    if(sure(b)){
      if(S.sessions.length>1){S.sessions=S.sessions.filter(y=>y!==s);S.cur=S.sessions[0].id}
      else s.solves=[];
      save();scrs=[];newScr();render();dg.close();
    }
  }
  else if(a==='mk'){
    const id=Date.now();
    S.sessions.push({id,name:$('#nn').value.trim()||'Session',event:$('#ne').value,solves:[]});
    S.cur=id;save();scrs=[];newScr();render();dg.close();
  }
});

/* Bluetooth — GAN (gan-web-bluetooth) + cubing.js fallback */
let btConn=null,btKind=null,btSub=null,btMoveCount=0,btBusy=false;
const SOLVED_FACELETS='UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB';
function setBtUi(connected,name){
  const b=$('#bt');
  if(!b)return;
  if(connected){
    b.textContent='BT ✓';
    b.title=name?`Connected: ${name} (click to disconnect)`:'Connected (click to disconnect)';
    b.style.borderColor='var(--grn)';
  }else{
    b.textContent='BT';
    b.title='Connect smart cube (Chrome/Edge + HTTPS/localhost)';
    b.style.borderColor='';
  }
}
function btStartFromMove(){
  if(st==='idle'&&!S.set.man){
    pen=0;
    st='run';t0=performance.now();
    document.body.classList.add('running');
    setS('run','');
    tick();
    btMoveCount=1;
  }else if(st==='insp'){
    const el=(performance.now()-i0)/1000;
    pen=el>17?-1:el>15?2000:0;
    st='run';t0=performance.now();
    document.body.classList.add('running');
    setS('run','');
    tick();
    btMoveCount=1;
  }else if(st==='run'){
    btMoveCount++;
  }
}
function onGanEvent(ev){
  if(!ev)return;
  if(ev.type==='MOVE')btStartFromMove();
  else if(ev.type==='FACELETS'&&st==='run'&&ev.facelets&&ev.facelets===SOLVED_FACELETS)stop();
  else if(ev.type==='DISCONNECT'){
    btConn=null;btKind=null;btSub=null;
    setBtUi(false);toast('Cube disconnected');
  }
}
function onCubingMove(e){
  btStartFromMove();
  try{
    const pat=e&&e.pattern;
    if(st==='run'&&pat&&pat.toString&&/solved|identity/i.test(String(pat)))stop();
  }catch(_){}
}
async function disconnectBt(){
  try{if(btSub&&typeof btSub.unsubscribe==='function')btSub.unsubscribe()}catch(_){}
  try{
    if(btConn){
      if(btKind==='gan'&&btConn.disconnect)await btConn.disconnect();
      else if(btKind==='cubing'&&btConn.disconnect)btConn.disconnect();
    }
  }catch(_){}
  btConn=null;btKind=null;btSub=null;
  setBtUi(false);
}
/* GAN needs MAC for AES keys; prompt if browser cannot auto-read ads */
async function ganMacProvider(device,isFallback){
  if(!isFallback)return null;
  const key='cubetimer.ganMac.'+(device&&device.id||'');
  let saved='';
  try{saved=localStorage.getItem(key)||''}catch(_){}
  const mac=prompt(
    'Enter this GAN cube MAC address (from CubeStation or the box), like AA:BB:CC:DD:EE:FF\\n\\nNeeded once for encryption.',
    saved
  );
  if(!mac)return null;
  const clean=mac.trim().toUpperCase().replace(/-/g,':');
  if(!/^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(clean)){
    toast('Invalid MAC format');
    return null;
  }
  try{localStorage.setItem(key,clean)}catch(_){}
  return clean;
}
async function loadGanConnect(){
  const urls=[
    'https://esm.sh/gan-web-bluetooth@3.0.2',
    'https://cdn.jsdelivr.net/npm/gan-web-bluetooth@3.0.2/+esm'
  ];
  for(const url of urls){
    try{
      const mod=await import(url);
      const fn=mod.connectGanCube||(mod.default&&mod.default.connectGanCube);
      if(typeof fn==='function')return fn;
    }catch(e){console.warn('GAN import failed',url,e)}
  }
  return null;
}
async function loadCubingConnect(){
  return null; // other brands via cubing.js disabled (CDN unreliable offline)
}
function errMsg(err){
  if(!err)return 'Unknown error';
  if(err.name==='NotFoundError')return 'No device selected';
  if(err.name==='SecurityError')return 'Bluetooth blocked (need HTTPS or localhost)';
  if(err.name==='NetworkError')return 'Cube disconnected during setup';
  if(err.name==='InvalidStateError')return 'Bluetooth busy — try again';
  const m=String(err.message||err);
  if(/MAC|mac address/i.test(m))return 'MAC address required — try again and enter it when prompted';
  if(/service|unsupported/i.test(m))return 'Unsupported cube model/firmware';
  return m.slice(0,120);
}
async function toggleBt(){
  if(btBusy)return;
  if(btConn){
    await disconnectBt();
    toast('Bluetooth disconnected');
    return;
  }
  if(!window.isSecureContext){
    toast('Bluetooth needs HTTPS or localhost (not file://)');
    return;
  }
  if(!navigator.bluetooth){
    toast('Web Bluetooth missing — use Chrome/Edge');
    return;
  }
  btBusy=true;
  const btn=$('#bt');
  if(btn)btn.textContent='…';
  try{
    const ganConnect=await loadGanConnect();
    if(ganConnect){
      try{
        toast('Pick your GAN cube…');
        const conn=await ganConnect(ganMacProvider);
        btConn=conn;btKind='gan';
        const name=conn.deviceName||(conn.device&&conn.device.name)||'GAN cube';
        setBtUi(true,name);
        toast('Connected: '+name);
        if(conn.events$&&conn.events$.subscribe)btSub=conn.events$.subscribe(onGanEvent);
        try{await conn.sendCubeCommand({type:'REQUEST_FACELETS'})}catch(_){}
        return;
      }catch(err){
        console.warn('GAN connect error',err);
        if(err&&err.name==='NotFoundError'){toast('No device selected');return}
        toast('GAN failed: '+errMsg(err)+' — trying other brands…');
      }
    }
    const cubingConnect=await loadCubingConnect();
    if(cubingConnect){
      try{
        toast('Pick any smart cube…');
        const puzzle=await cubingConnect();
        btConn=puzzle;btKind='cubing';
        const name=(puzzle.name&&puzzle.name())||'Smart cube';
        setBtUi(true,name);
        toast('Connected: '+name);
        puzzle.addAlgLeafListener(onCubingMove);
        try{
          const dev=puzzle.server&&puzzle.server.device;
          if(dev)dev.addEventListener('gattserverdisconnected',()=>{
            btConn=null;btKind=null;setBtUi(false);toast('Cube disconnected');
          });
        }catch(_){}
        return;
      }catch(err){
        console.warn('cubing connect error',err);
        toast('Connect failed: '+errMsg(err));
        setBtUi(false);
        return;
      }
    }
    toast('Could not load Bluetooth libraries (check network)');
    setBtUi(false);
  }finally{
    btBusy=false;
    if(!btConn)setBtUi(false);
  }
}
